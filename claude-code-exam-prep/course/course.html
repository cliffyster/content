<script>
// The artifact harness supplies <head>, so a viewport meta may be absent.
// Without it iOS Safari uses a 980px virtual viewport and scales the page
// down, which stops every max-width media query below from ever matching.
(function () {
  try {
    if (!document.querySelector('meta[name="viewport"]')) {
      var m = document.createElement("meta");
      m.name = "viewport";
      m.content = "width=device-width, initial-scale=1, viewport-fit=cover";
      document.head.appendChild(m);
    }
  } catch (e) { /* non-fatal: the page still renders, just wide */ }
})();

<title>The Claude Code Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --rail:#E7EBF0;
  --ink:#141D27; --body:#33414F; --muted:#6B7B8C; --faint:#93A2B1;
  --rule:#D2DAE3; --rule-soft:#E3E9EF;
  --signal:#B03D0B; --signal-soft:#FBEDE4;
  --verify:#0D6B62; --verify-soft:#E2F1EF;
  --wrong:#A02236; --wrong-soft:#FBE9EC;
  --code-bg:#E8EDF3; --code-surface:#F8FAFC;
  --shadow:0 1px 2px rgba(20,29,39,.05),0 8px 24px -14px rgba(20,29,39,.2);
  --f-display:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1119; --surface:#131B24; --surface-2:#0F1720; --rail:#101820;
  --ink:#E7EDF4; --body:#B9C6D3; --muted:#8496A7; --faint:#64768A;
  --rule:#25313E; --rule-soft:#1B2632;
  --signal:#F08A4B; --signal-soft:#2A1B12;
  --verify:#4ECDC0; --verify-soft:#0F2523;
  --wrong:#F0808F; --wrong-soft:#2A151A;
  --code-bg:#1B2530; --code-surface:#0D141C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0B1119; --surface:#131B24; --surface-2:#0F1720; --rail:#101820;
  --ink:#E7EDF4; --body:#B9C6D3; --muted:#8496A7; --faint:#64768A;
  --rule:#25313E; --rule-soft:#1B2632;
  --signal:#F08A4B; --signal-soft:#2A1B12;
  --verify:#4ECDC0; --verify-soft:#0F2523;
  --wrong:#F0808F; --wrong-soft:#2A151A;
  --code-bg:#1B2530; --code-surface:#0D141C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);
  font-family:var(--f-body);font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--ink);text-wrap:balance;margin:0}
code,kbd{font-family:var(--f-mono)}
a{color:var(--signal);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:35}
.rail{background:var(--rail);border-right:1px solid var(--rule);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 20px 40px}
.pane{padding:44px 46px 120px;max-width:860px}

/* ---------- rail ---------- */
.rail-top{padding-bottom:18px;border-bottom:1px solid var(--rule-soft);margin-bottom:18px;
  position:relative}
.rail-close{display:none;position:absolute;top:-6px;right:-4px;width:40px;height:40px;
  background:none;border:0;cursor:pointer;font-size:26px;line-height:1;color:var(--muted);
  border-radius:3px}
.rail-close:hover{color:var(--ink)}
.rail-top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.rail-top .cert{margin-top:5px}
.meter{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;background:var(--verify);width:0;transition:width .35s ease}
.meter-lbl{display:flex;justify-content:space-between;margin-top:7px;
  font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod{margin-bottom:20px}
.mod-h{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}
.mod-h .n{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--faint);
  letter-spacing:.1em;flex:0 0 auto}
.mod-h .t{font-family:var(--f-display);font-size:12.5px;font-weight:600;color:var(--ink);
  letter-spacing:.005em;line-height:1.3}
.mod ol{list-style:none;margin:0;padding:0 0 0 2px;display:flex;flex-direction:column;gap:1px}
.nav-l{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  background:none;border:0;border-radius:3px;padding:6px 8px;cursor:pointer;
  font-family:var(--f-body);font-size:14px;line-height:1.35;color:var(--body);
  transition:background .12s ease}
.nav-l:hover:not(:disabled){background:var(--surface)}
.nav-l:disabled{color:var(--faint);cursor:not-allowed}
.nav-l[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:inset 2px 0 0 var(--signal)}
.nav-l .st{flex:0 0 auto;width:13px;height:13px;margin-top:4px;border-radius:50%;
  border:1.5px solid var(--rule);position:relative}
.nav-l.done .st{background:var(--verify);border-color:var(--verify)}
.nav-l.done .st::after{content:"";position:absolute;left:3.5px;top:1px;width:3px;height:6px;
  border:solid var(--surface);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.nav-l[aria-current="true"] .st{border-color:var(--signal)}
.rail-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule-soft)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-mono);
  font-size:11px;color:var(--muted);letter-spacing:.04em}
.linkbtn:hover{color:var(--signal)}

/* ---------- lesson ---------- */
.crumb{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.crumb .sep{color:var(--faint)}
h2.lesson-t{font-size:clamp(28px,4.2vw,40px);font-weight:700;letter-spacing:-.028em;
  line-height:1.08;margin-bottom:18px}
.obj{display:flex;gap:12px;background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--signal);border-radius:0 3px 3px 0;padding:13px 17px;margin-bottom:34px}
.obj .lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--signal);flex:0 0 auto;padding-top:4px}
.obj p{margin:0;font-size:15.5px;color:var(--ink)}

.teach{font-size:17.5px}
.teach p{margin:0 0 17px;max-width:70ch}
.teach ul,.teach ol{max-width:68ch;margin:0 0 17px;padding-left:22px}
.teach li{margin-bottom:7px}
.teach ol.steps{counter-reset:s;list-style:none;padding-left:0}
.teach ol.steps li{counter-increment:s;position:relative;padding-left:34px;margin-bottom:11px}
.teach ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;
  font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--signal);
  background:var(--signal-soft);width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center}
.teach b{color:var(--ink);font-weight:600}
.teach code{background:var(--code-bg);padding:1.5px 5px;border-radius:2px;
  font-size:.84em;color:var(--ink);white-space:nowrap}
.teach p.callout{background:var(--signal-soft);border-left:3px solid var(--signal);
  padding:14px 18px;border-radius:0 3px 3px 0;max-width:68ch}
.teach p.rule-flow{font-family:var(--f-mono);font-size:16px;text-align:center;
  background:var(--surface);border:1px dashed var(--rule);border-radius:3px;
  padding:14px;color:var(--ink);max-width:none}
.teach pre.mini{background:var(--code-surface);border:1px solid var(--rule);border-radius:3px;
  padding:13px 15px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;
  line-height:1.6;margin:0 0 17px;color:var(--body)}
.tbl{width:100%;border-collapse:collapse;margin:0 0 20px;font-size:15px;display:block;
  overflow-x:auto;white-space:normal}
.tbl th{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 14px 8px 0;
  border-bottom:1px solid var(--rule)}
.tbl td{padding:9px 14px 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top;
  line-height:1.5}
.tbl td:last-child,.tbl th:last-child{padding-right:0}
.tbl code{background:var(--code-bg);padding:1px 5px;border-radius:2px;font-size:12.5px;color:var(--ink)}

.ex{margin:30px 0 34px}
.ex-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ex pre{background:var(--code-surface);border:1px solid var(--rule);border-radius:3px;
  padding:17px 19px;overflow-x:auto;margin:0;font-family:var(--f-mono);
  font-size:13.5px;line-height:1.72;color:var(--body)}

.take{display:flex;gap:12px;background:var(--verify-soft);border:1px solid var(--verify);
  border-radius:3px;padding:15px 18px;margin:32px 0 42px}
.take .lbl{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--verify);flex:0 0 auto;padding-top:4px}
.take p{margin:0;font-size:16px;color:var(--ink);font-weight:600;max-width:62ch}

/* ---------- checks ---------- */
.checks{border-top:1px solid var(--rule);padding-top:30px}
.checks-h{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.checks-h h3{font-size:19px;font-weight:600}
.checks-sub{margin:0 0 26px;font-size:15px;color:var(--muted);max-width:64ch}
.chk{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--rule);
  border-radius:3px;padding:20px 22px;margin-bottom:16px;transition:border-left-color .2s}
.chk.ok{border-left-color:var(--verify)}
.chk.no{border-left-color:var(--wrong)}
.chk .qn{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.08em;
  display:block;margin-bottom:9px}
.chk .qt{font-size:16.5px;color:var(--ink);font-weight:600;line-height:1.45;
  margin:0 0 16px;max-width:64ch}
.chk .opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  font-family:var(--f-body);font-size:15.5px;line-height:1.5;color:var(--body);
  background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:3px;
  padding:11px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt .mk{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);
  flex:0 0 auto;width:15px;padding-top:2px}
.opt.sel{border-color:var(--ink)}
.opt.right{background:var(--verify-soft);border-color:var(--verify)}
.opt.right .mk{color:var(--verify)}
.opt.picked-wrong{background:var(--wrong-soft);border-color:var(--wrong)}
.opt.picked-wrong .mk{color:var(--wrong)}
.multi{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin:11px 0 0}
.why{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-soft)}
.why .vd{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:7px}
.why .vd.ok{color:var(--verify)} .why .vd.no{color:var(--wrong)}
.why p{margin:0;font-size:15.5px;max-width:66ch}
.chk-actions{margin-top:14px;display:flex;gap:9px}

.foot-nav{display:flex;gap:12px;align-items:center;margin-top:42px;padding-top:26px;
  border-top:1px solid var(--rule);flex-wrap:wrap}
.btn{font-family:var(--f-display);font-size:14.5px;font-weight:600;padding:10px 20px;
  border-radius:3px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);transition:opacity .12s}
.btn:hover:not(:disabled){opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover:not(:disabled){border-color:var(--muted);opacity:1}
.btn.sm{font-size:13px;padding:7px 14px}
.btn:disabled{opacity:.32;cursor:not-allowed}
.gate{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);
  text-align:right}

/* ---------- intro / done panels ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:30px 32px;box-shadow:var(--shadow)}
.panel h3{font-size:21px;font-weight:600;margin-bottom:12px}
.panel p{max-width:64ch}
.map{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:3px;overflow:hidden;margin:22px 0 0}
.map .row{background:var(--surface);padding:13px 16px;display:flex;gap:14px;align-items:baseline}
.map .row .n{font-family:var(--f-mono);font-size:11px;color:var(--signal);
  letter-spacing:.08em;flex:0 0 auto;width:26px}
.map .row .t{font-family:var(--f-display);font-weight:600;color:var(--ink);font-size:15px;
  flex:0 0 auto;width:200px}
.map .row .d{font-size:14.5px;color:var(--muted);line-height:1.45}

/* ---------- mobile ---------- */
.mobile-bar{display:none}
@media(max-width:960px){
  /* Single column: the rail becomes an off-canvas drawer.
     minmax(0,1fr), not 1fr — a bare 1fr is minmax(auto,1fr) and its auto
     minimum refuses to shrink below the content's min-content width, so one
     long inline <code> pushes the whole column past the viewport. */
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(310px,86vw);z-index:40;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow);
    padding:20px 16px 40px}
  .rail.open{transform:none}
  .scrim.open{display:block}
  .rail-close{display:block}
  .rail-top h1{padding-right:34px}

  .pane{padding:0 18px 88px;max-width:none;min-width:0}
  .mobile-bar{display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:30;
    background:var(--paper);border-bottom:1px solid var(--rule);
    margin:0 -18px 20px;padding:10px 18px;
    /* keep clear of the notch / home indicator */
    padding-top:calc(10px + env(safe-area-inset-top))}

  body{font-size:16.5px;line-height:1.62}
  .teach{font-size:16.5px}
  .teach p,.teach ul,.teach ol,.teach p.callout,.chk .qt,.take p,.obj p,.why p{max-width:none}
  h2.lesson-t{font-size:clamp(25px,7.5vw,33px);line-height:1.14;margin-bottom:15px}

  /* Label-above-text instead of a squeezed two-column flex. */
  .obj,.take{flex-direction:column;gap:6px;padding:13px 15px}
  .obj{margin-bottom:26px}
  .take{margin:26px 0 34px}

  /* Long code and wide tables scroll inside themselves, never the page. */
  .ex pre,.teach pre.mini{font-size:12.5px;line-height:1.65;padding:14px;
    -webkit-overflow-scrolling:touch}
  .tbl{font-size:14.5px;display:block;width:100%;overflow-x:auto;
    -webkit-overflow-scrolling:touch}
  .tbl th,.tbl td{padding:8px 12px 8px 0;min-width:104px}

  /* An inline code span must be allowed to wrap, or it widens the page. */
  /* Inline code may wrap. Code INSIDE a <pre> must not — a bare `code`
     selector here silently destroys every code block's line breaks. */
  .teach p code,.teach li code,.tbl code,.opt code,.obj code,.why code,.take code,
  .chk .qt code{white-space:normal;overflow-wrap:anywhere}
  pre code,.ex pre code,.teach pre.mini code{white-space:pre;overflow-wrap:normal}
  .teach,.teach p,.teach li,.chk .qt,.why p,.take p,.obj p,.crumb,h2.lesson-t{
    min-width:0;overflow-wrap:break-word}
  .ex,.ex pre,.teach pre.mini,.tbl{max-width:100%;min-width:0}
  .teach p.rule-flow{font-size:14px;padding:12px;overflow-wrap:anywhere}

  /* Comfortable tap targets. */
  .chk{padding:17px 15px}
  .opt{padding:13px 13px;font-size:15.5px;min-height:46px}
  .nav-l{padding:9px 8px;font-size:14.5px}
  .btn{padding:12px 18px;min-height:46px}
  .btn.sm{padding:9px 14px;min-height:40px}

  .foot-nav{gap:9px;margin-top:34px}
  .foot-nav .btn{flex:1 1 auto}
  .gate{margin-left:0;flex:1 0 100%;text-align:left;order:3}

  .panel{padding:22px 18px}
  .map .row{flex-direction:column;gap:4px;padding:12px 14px}
  .map .row .t{width:auto}
  .map .row .n{width:auto}
}
@media(max-width:400px){
  .pane{padding:0 14px 88px}
  .mobile-bar{margin:0 -14px 18px;padding-left:14px;padding-right:14px}
  .ex pre,.teach pre.mini{font-size:11.5px}
}
}
</style>

<script>
const COURSE = [{"id":"m1","title":"How Claude Code works","blurb":"Before any configuration makes sense, you need the mental model: what a session is, what Claude can see, and who decides what runs.","lessons":[{"id":"l1","title":"What Claude Code actually is","objective":"Describe the agent loop and say what makes Claude Code different from a chat window.","teach":"\n<p>Claude Code is <b>an agent that runs on your machine</b>. You describe a goal in\nplain English; it reads files, runs commands, and edits code to get there, then\nreports back. That loop \u2014 think, act, observe, repeat \u2014 is the whole product.</p>\n\n<p>The difference from a chat window is that it <b>acts on real state</b>. A chat\nassistant returns text you then apply yourself. Claude Code applies it. That is\nwhy almost everything else you will learn is about <b>constraining what it may\ndo</b>, rather than about getting better answers.</p>\n\n<p>One turn looks like this:</p>\n<ol>\n<li>You send a prompt.</li>\n<li>Claude decides on a <b>tool call</b> \u2014 read this file, run this command, edit\nthat function.</li>\n<li>The <b>harness</b> \u2014 the Claude Code program itself, not the model \u2014 decides\nwhether that call is allowed. It may run it, block it, or ask you.</li>\n<li>The result goes back to Claude, which decides on the next call, or stops and\nanswers.</li>\n</ol>\n\n<p>Hold on to step 3. The model <em>proposes</em>; the harness <em>disposes</em>.\nEvery permission rule, hook and sandbox setting in this course is you\nprogramming step 3.</p>\n","example":{"label":"The surfaces it runs on","lang":"text","code":"claude                    # interactive terminal session\nclaude -p \"fix the test\"   # one-shot, non-interactive (scripts, CI)\n\n# also: VS Code and JetBrains extensions, a desktop app,\n# claude.ai/code on the web, GitHub Actions, and a Slack integration."},"takeaway":"Claude proposes tool calls; the harness decides whether they run. Configuration is how you program that decision.","checks":[{"q":"You add a rule that blocks a command. Claude still tries to run it. Is that a failure?","choices":["Yes \u2014 the rule should stop Claude from trying","No \u2014 Claude proposes tool calls and the harness blocks them; a blocked attempt is the system working","Yes \u2014 it means the rule syntax is wrong","Only if it happens more than once"],"answer":[1],"why":"Rules act on the harness, not on Claude's intentions. Claude may well propose a blocked call; the block is what makes the rule real. This is why enforcement lives in rules and hooks rather than in instructions you write in prose."}]},{"id":"l2","title":"The context window","objective":"Say what is loaded before you type, and why context is the scarce resource.","teach":"\n<p>Claude has no memory between sessions. Everything it knows about your project\narrives in the <b>context window</b> \u2014 a finite budget of tokens holding the\nsystem prompt, your instructions, the conversation, and every file it has read.</p>\n\n<p>Before you type a single character, a session has already loaded:</p>\n<ul>\n<li>the <b>system prompt</b> (~4k tokens) \u2014 core instructions you never see</li>\n<li><b>auto memory</b> \u2014 notes Claude wrote itself in past sessions</li>\n<li><b>environment info</b> \u2014 working directory, platform, shell, plus git branch\nand status as a separate block</li>\n<li><b>your CLAUDE.md files</b> and any unscoped rules</li>\n<li><b>tool definitions</b>, and the <em>names</em> of MCP tools</li>\n</ul>\n\n<p>Two consequences follow, and they drive a lot of later design:</p>\n\n<p><b>Context is spent, not free.</b> A 400-line CLAUDE.md costs its tokens on\nevery single turn, forever. That is the argument for moving long procedures into\nskills, which load only when used.</p>\n\n<p><b>Reading files is the main cost.</b> A search that opens forty files can\nconsume more window than the entire rest of your session. That is the argument\nfor subagents, which do the reading in a <em>separate</em> window and hand back\nonly the conclusion.</p>\n","example":{"label":"Inspect your own session","lang":"bash","code":"/context     # visualize what is in the window right now\n/compact     # summarize the history, keep working\n/clear       # throw the history away and start fresh"},"takeaway":"Everything Claude knows is in one finite window. Context is the budget you are always spending.","checks":[{"q":"You finish one task and start a completely unrelated one in the same session. /clear or /compact?","choices":["/compact \u2014 it preserves useful history","/clear \u2014 the task changed, so the old history is pure cost","Neither; open a new terminal","/context"],"answer":[1],"why":"/compact summarizes and continues, which is right when the same task got long. When the task itself changed, that history has no future value \u2014 it is just tokens you keep paying for. /clear is correct."},{"q":"Why does reading many files hurt more than a long prompt?","choices":["File contents are billed at a higher rate","File contents stay in the window for the rest of the session, so their cost repeats every turn","Files are never compacted","It does not \u2014 they cost the same"],"answer":[1],"why":"Once read, a file's contents sit in the conversation and are re-sent with every subsequent turn. A one-off long prompt is paid once; forty files are paid over and over. This is precisely the problem subagents solve."}]},{"id":"l3","title":"Permission prompts","objective":"Predict which actions prompt you, and know what 'don't ask again' actually writes.","teach":"\n<p>In the default mode \u2014 called <b>Manual</b> \u2014 Claude Code starts read-only and\nasks before it changes anything. The rough shape:</p>\n\n<ul>\n<li><b>Never prompts:</b> reading files, <code>Grep</code>, <code>Glob</code>,\nand a built-in set of read-only shell commands like <code>ls</code>,\n<code>cat</code> and <code>git status</code>.</li>\n<li><b>Prompts:</b> editing or writing files, and any other shell command.</li>\n</ul>\n\n<p>There is also a <b>working directory boundary</b>. Claude Code writes only\ninside the folder you started it in and below. In Manual mode it even asks\nbefore <em>reading</em> outside that boundary.</p>\n\n<p>When you answer a prompt with <b>\u201cYes, and don't ask again\u201d</b>, that is not a\nvague preference. Claude Code writes a concrete <b>allow rule</b> into\n<code>.claude/settings.local.json</code> \u2014 a real file, in your project, that you\ncan open and edit. Understanding that file is the bridge to the next module.</p>\n\n<p>One detail that surprises people: that file is read from the <b>repository\nroot</b>, even if you started Claude Code in a subdirectory. So an approval you\ngive in <code>src/api/</code> applies across the whole repo.</p>\n","example":{"label":"What 'don't ask again' writes","lang":"json","code":"// .claude/settings.local.json  \u2014 created for you, yours alone, gitignored\n{\n  \"permissions\": {\n    \"allow\": [\n      \"Bash(npm test:*)\"\n    ]\n  }\n}"},"takeaway":"Manual mode is read-only by default. 'Don't ask again' writes a real allow rule to .claude/settings.local.json.","checks":[{"q":"Which of these run WITHOUT a prompt in Manual mode?","choices":["Editing a file","git status","npm install","curl https://example.com"],"answer":[1],"why":"A built-in read-only command set \u2014 ls, cat, git status, git diff, grep, find \u2014 runs without asking. Edits prompt, arbitrary commands prompt, and network commands like curl and wget are specifically NOT auto-approved."}]},{"id":"l4","title":"CLAUDE.md \u2014 telling Claude about your project","objective":"Know what belongs in CLAUDE.md, where it lives, and why it is not enforcement.","teach":"\n<p><code>CLAUDE.md</code> is a plain markdown file of standing instructions,\nloaded into context at the start of every session. It is where you write down\nwhat you would otherwise re-explain: build commands, conventions, project\nlayout, \u201calways do X\u201d rules.</p>\n\n<p>It can live in several places, loaded broadest-first:</p>\n<ul>\n<li><b>Managed policy</b> \u2014 deployed by your organization, cannot be excluded</li>\n<li><b>User</b> \u2014 <code>~/.claude/CLAUDE.md</code>, all your projects</li>\n<li><b>Project</b> \u2014 <code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code>, committed for the team</li>\n<li><b>Local</b> \u2014 <code>./CLAUDE.local.md</code>, yours, gitignored</li>\n</ul>\n\n<p>Files are <b>concatenated, not overridden</b>, ordered from the filesystem\nroot down to your working directory \u2014 so the instructions closest to where you\nlaunched are read <em>last</em>.</p>\n\n<p>Now the most important sentence in this lesson:</p>\n\n<p class=\"callout\"><b>CLAUDE.md is context, not enforced configuration.</b> Claude\nreads it and tries to follow it. There is no guarantee, especially for vague or\nconflicting instructions.</p>\n\n<p>So \u201calways run the linter before committing\u201d in CLAUDE.md is a <em>hope</em>.\nIf it truly must happen every time, it belongs in a hook \u2014 which you will meet\nin Module 3. Keep CLAUDE.md for facts, under about 200 lines, and specific:\n\u201cUse 2-space indentation\u201d beats \u201cformat code properly\u201d.</p>\n","example":{"label":"A CLAUDE.md that earns its tokens","lang":"markdown","code":"# payments-api\n\n## Commands\n- `make test` \u2014 full suite (needs a local Redis)\n- `make lint` \u2014 ruff + mypy, run before committing\n\n## Layout\n- API handlers live in `src/api/handlers/`\n- Anything touching money goes through `src/ledger/` \u2014 never write to\n  the balances table directly\n\n## Conventions\n- 2-space indentation, no tabs\n- New endpoints need a test in `tests/api/` before review"},"takeaway":"CLAUDE.md is loaded every session and is guidance, not enforcement. Facts here; procedures in skills; guarantees in hooks.","checks":[{"q":"You put 'always run make lint before committing' in CLAUDE.md and Claude sometimes forgets. What is the structural fix?","choices":["Write it in capital letters","Repeat it in three places","Move it to a hook \u2014 CLAUDE.md is context, not enforcement","Move it to settings.json"],"answer":[2],"why":"No amount of emphasis makes context into enforcement. An instruction tied to a specific moment \u2014 before every commit, after each edit \u2014 belongs in a hook, which the harness executes as code regardless of what Claude decides."},{"q":"You have CLAUDE.md at the repo root and another in src/api/. You launch Claude Code in src/api/. What happens?","choices":["Only src/api/CLAUDE.md loads \u2014 the nearest wins","Both load, concatenated, with the root file first and src/api/ last","Only the root file loads","They conflict and Claude Code errors"],"answer":[1],"why":"All discovered files are concatenated rather than overriding each other, ordered from the filesystem root down to your working directory. Instructions closest to where you launched are read last."}]}]},{"id":"m2","title":"Controlling what Claude can do","blurb":"The permission system is the densest examinable area and the one where intuition is most often wrong. Take it slowly.","lessons":[{"id":"l5","title":"deny \u2192 ask \u2192 allow","objective":"State the evaluation order and predict the outcome when rules overlap.","teach":"\n<p>You write permission rules in a settings file under three lists:\n<code>deny</code>, <code>ask</code> and <code>allow</code>. When Claude proposes a\ntool call, the harness checks them in a fixed order:</p>\n\n<p class=\"rule-flow\"><b>deny</b> &rarr; <b>ask</b> &rarr; <b>allow</b></p>\n\n<p><b>The first match in that order wins, and specificity is irrelevant.</b> This\nis the single most tested fact in the whole syllabus, and it is the opposite of\nhow CSS, firewall rules, and most things programmers know actually work.</p>\n\n<p>Concretely: you have <code>Bash(aws *)</code> in deny and\n<code>Bash(aws s3 ls)</code> in allow. Claude proposes <code>aws s3 ls</code>.\nThe deny list is checked first, it matches, and the call is blocked \u2014 even\nthough your allow rule is far more specific.</p>\n\n<p class=\"callout\">A deny rule <b>cannot carry allowlist exceptions</b>. If you\nneed \u201cblock all of X except Y\u201d, deny rules alone cannot express it. You will\nlearn the technique that can in Module 3.</p>\n\n<p>The same asymmetry holds between ask and allow: a matching ask rule prompts\nyou even when a more specific allow rule also matches.</p>\n\n<p>One more distinction. A <b>bare tool name</b> in deny behaves differently from\na scoped rule:</p>\n<ul>\n<li><code>deny: Bash</code> \u2014 removes the tool from Claude's context entirely. It\nnever sees that the tool exists.</li>\n<li><code>deny: Bash(rm *)</code> \u2014 the tool stays available; matching calls are\nblocked when attempted.</li>\n</ul>\n","example":{"label":"Reading a config the way the harness does","lang":"json","code":"{\n  \"permissions\": {\n    \"deny\":  [\"Read(./.env)\", \"Bash(aws *)\"],\n    \"ask\":   [\"Bash(git push *)\"],\n    \"allow\": [\"Bash(npm test:*)\", \"Bash(aws s3 ls)\"]\n  }\n}\n\n// aws s3 ls    -> BLOCKED. deny matched first; the allow never gets a look.\n// git push     -> PROMPTS. ask matched before allow could apply.\n// npm test -v  -> RUNS.    no deny, no ask, allow matched."},"takeaway":"deny \u2192 ask \u2192 allow, first match wins, specificity never breaks the tie.","checks":[{"q":"deny has Bash(aws *). allow has Bash(aws s3 ls). Claude proposes `aws s3 ls`. What happens?","choices":["It runs \u2014 the allow rule is more specific","It is blocked \u2014 deny is evaluated first and specificity does not matter","You are prompted to break the tie","Claude Code reports a configuration conflict"],"answer":[1],"why":"Rules are evaluated deny, then ask, then allow, and the first match in that order determines the outcome. A broad deny blocks everything it matches, so a deny rule can never carry an allowlist exception."},{"q":"What does `deny: Bash` do that `deny: Bash(rm *)` does not?","choices":["Nothing \u2014 they are equivalent","It removes the tool from Claude's context entirely, so Claude never sees it","It applies only in bypassPermissions mode","It blocks the tool for subagents only"],"answer":[1],"why":"A bare tool name in deny removes the tool from Claude's context. A scoped rule leaves the tool available and blocks only matching calls. (One exception: EndConversation cannot be removed while any other tool remains.)"}]},{"id":"l6","title":"Bash rule syntax","objective":"Write a Bash allow rule that matches what you intend and nothing more.","teach":"\n<p>Bash rule wildcards look like shell globs and are not. Three mechanics decide\neverything.</p>\n\n<p><b>1. A space before the trailing <code>*</code> creates a word boundary.</b></p>\n<table class=\"tbl\">\n<tr><th>Rule</th><th>Matches</th><th>Does not match</th></tr>\n<tr><td><code>Bash(ls *)</code></td><td><code>ls -la</code></td><td><code>lsof</code></td></tr>\n<tr><td><code>Bash(ls*)</code></td><td><code>ls -la</code> and <code>lsof</code></td><td>\u2014</td></tr>\n</table>\n<p>Miss that space and you have silently widened your allowlist to every command\nstarting with those letters. <code>Bash(ls:*)</code> is an equivalent way to write\nthe word-boundary form.</p>\n\n<p><b>2. Shell operators split the command, and every part must match\nindependently.</b> The recognised separators are\n<code>&amp;&amp;</code>, <code>||</code>, <code>;</code>, <code>|</code>,\n<code>|&amp;</code>, <code>&amp;</code> and newlines. So\n<code>Bash(safe-cmd *)</code> does <em>not</em> approve\n<code>safe-cmd &amp;&amp; rm -rf /</code>. This is a deliberate defence, and it is\nwhy you cannot smuggle a command past a prefix rule.</p>\n\n<p><b>3. A fixed list of wrappers is stripped before matching.</b>\n<code>timeout</code>, <code>time</code>, <code>nice</code>, <code>nohup</code>,\n<code>stdbuf</code>, the builtins <code>command</code> and <code>builtin</code>,\nzsh's <code>noglob</code>, and bare <code>xargs</code>. So\n<code>Bash(npm test *)</code> also covers <code>timeout 30 npm test</code>.</p>\n\n<p class=\"callout\"><b>And here is the trap.</b> Environment runners are\n<em>not</em> stripped \u2014 <code>npx</code>, <code>docker exec</code>,\n<code>devbox run</code>, <code>direnv exec</code>, <code>mise exec</code>. Which\nmeans <code>Bash(devbox run *)</code> matches <code>devbox run rm -rf .</code>.\nWrite one rule per inner command instead: <code>Bash(devbox run npm test)</code>.</p>\n\n<p>Finally, some things can never be prefix-approved: the exec wrappers\n<code>watch</code>, <code>setsid</code>, <code>ionice</code>, <code>flock</code>,\nand <code>find</code> with <code>-exec</code> or <code>-delete</code>. They always\nprompt in Manual mode.</p>\n","example":{"label":"Narrow rules that hold","lang":"json","code":"{\n  \"permissions\": {\n    \"allow\": [\n      \"Bash(npm run test:*)\",     // npm run test, npm run test:watch...\n      \"Bash(git diff *)\",          // any git diff invocation\n      \"Bash(git log *)\",\n      \"Bash(devbox run npm test)\"  // NOT Bash(devbox run *)\n    ],\n    \"deny\": [\"Bash(curl *)\", \"Bash(wget *)\"]\n  }\n}"},"takeaway":"The space before * is a word boundary; shell operators split the command; environment runners are not stripped.","checks":[{"q":"Your allow rule is Bash(ls *). Which commands does it match?","choices":["Both `ls -la` and `lsof`","`ls -la` but not `lsof`","`lsof` but not `ls -la`","Neither \u2014 a trailing wildcard is invalid in allow"],"answer":[1],"why":"A '*' at the end preceded by a space enforces a word boundary: the prefix must be followed by a space or end-of-string. Written without the space, Bash(ls*) matches both."},{"q":"You allow Bash(devbox run *). Why is that dangerous?","choices":["devbox is not a real command","Environment runners are not stripped before matching, so the rule matches `devbox run rm -rf .`","It only works on Linux","It is not dangerous \u2014 the runner sandboxes what it runs"],"answer":[1],"why":"The wrapper-stripping list is fixed and does not include environment runners like devbox, npx, docker exec, direnv exec or mise exec. Because these execute their arguments as a command, a prefix rule covering the runner covers anything you can pass it. Write one rule per inner command."},{"q":"With Bash(safe-cmd *) allowed, Claude proposes `safe-cmd && rm -rf /tmp/x`. What happens?","choices":["It runs \u2014 the rule matched the start","It is not auto-approved; each subcommand must match a rule independently","Only the first half runs","Claude Code rejects the rule at startup"],"answer":[1],"why":"Claude Code is aware of shell operators. It splits on &&, ||, ;, |, |&, & and newlines, and requires every subcommand to match independently."}]},{"id":"l7","title":"File rules \u2014 the silent no-op","objective":"Write a file permission rule that is actually consulted.","teach":"\n<p>You want to stop Claude reading your <code>.env</code>. The obvious rule is\nwrong in a way that produces no error at the moment you need it.</p>\n\n<p class=\"callout\"><b>File permission checks consult only\n<code>Read(path)</code> and <code>Edit(path)</code> rules.</b> A path rule\nwritten for <code>Write</code>, <code>NotebookEdit</code>, <code>Glob</code> or\nthe legacy <code>MultiEdit</code> is accepted, stored, and <b>never\nconsulted</b>.</p>\n\n<p>Claude Code warns at startup \u2014 but the file was still readable the whole time\nyou thought it was protected.</p>\n\n<table class=\"tbl\">\n<tr><th>Intent</th><th>Wrong</th><th>Right</th></tr>\n<tr><td>Block reads</td><td><code>Glob(./secrets/**)</code></td><td><code>Read(./secrets/**)</code></td></tr>\n<tr><td>Block writes</td><td><code>Write(./secrets/**)</code></td><td><code>Edit(./secrets/**)</code></td></tr>\n</table>\n\n<p><code>Edit(path)</code> governs <em>all</em> the built-in tools that write\nfiles, <code>Write</code> and <code>NotebookEdit</code> included. There is one\nrule form for reading and one for writing; that is the whole vocabulary.</p>\n\n<p><b>Path anchors matter too.</b> <code>./x</code> is relative to the settings\nfile. <code>//x</code> is absolute from the filesystem root \u2014 so\n<code>Read(//Users/alice/secrets/**)</code> means the real\n<code>/Users/alice/secrets</code>. A single leading slash anchors at the rule's\nsource instead, which is rarely what you meant.</p>\n\n<p>One more: <b>output redirection is checked as a file write</b>. A rule\nallowing <code>git commit</code> allows the command, not the target of a\n<code>&gt;</code> in it. <code>/dev/null</code> is exempt; a target containing\n<code>~</code> or a glob always prompts.</p>\n","example":{"label":"Excluding secrets, correctly","lang":"json","code":"{\n  \"permissions\": {\n    \"deny\": [\n      \"Read(./.env)\",\n      \"Read(./.env.*)\",\n      \"Read(./secrets/**)\",\n      \"Edit(./secrets/**)\",\n      \"Read(//Users/me/.ssh/**)\"\n    ]\n  }\n}"},"takeaway":"Only Read(path) and Edit(path) are consulted. Write/Glob/NotebookEdit path rules are accepted and ignored.","checks":[{"q":"You want to stop Claude reading .env files. Which rule works?","choices":["deny: Read(./.env)","deny: Write(./.env)","deny: Glob(./.env)","deny: NotebookEdit(./.env)"],"answer":[0],"why":"File permission checks consult only Edit(path) and Read(path). The other three are accepted, warned about at startup, and never consulted \u2014 a rule that looks like protection and is not."}]},{"id":"l8","title":"Permission modes","objective":"Pick the right mode for a task and know what each stops auto-approving.","teach":"\n<p>A mode sets the baseline for everything your rules do not explicitly cover.\nSwitch with <b>Shift+Tab</b> in the CLI.</p>\n\n<table class=\"tbl\">\n<tr><th>Mode</th><th>What runs without asking</th></tr>\n<tr><td><code>default</code> (Manual)</td><td>Read-only commands only. Everything else prompts.</td></tr>\n<tr><td><code>plan</code></td><td>Reads and read-only commands. Claude explores and proposes, never edits your source.</td></tr>\n<tr><td><code>acceptEdits</code></td><td>File edits, plus <code>mkdir</code>, <code>touch</code>, <code>mv</code>, <code>cp</code>, <code>sed</code> in the working directory.</td></tr>\n<tr><td><code>auto</code></td><td>A classifier model reviews actions instead of you.</td></tr>\n<tr><td><code>dontAsk</code></td><td>Nothing new \u2014 anything not pre-approved is <b>denied</b>, not prompted.</td></tr>\n<tr><td><code>bypassPermissions</code></td><td>Almost everything, including writes to <code>.git</code> and <code>.claude</code>.</td></tr>\n</table>\n\n<p>Two are worth extra attention.</p>\n\n<p><b><code>dontAsk</code> is the CI mode.</b> It converts every prompt into a\ndenial. That makes your tool surface fixed and explicit, which is exactly what\nyou want when no human is watching.</p>\n\n<p><b><code>plan</code> is stronger than it looks.</b> File edits are never\nauto-approved in plan mode, <em>even when an allow rule matches</em>. That is a\ndeliberate exception to normal rule evaluation.</p>\n\n<p>Regardless of mode, a short list is <b>never</b> auto-approved: anything\nmatched by an explicit ask rule, tools that require user interaction like\n<code>AskUserQuestion</code>, and <code>rm</code>/<code>rmdir</code> targeting a\ncritical path. There are also <b>protected paths</b> \u2014 <code>.git</code>,\n<code>.vscode</code>, <code>.idea</code>, <code>.husky</code> and friends \u2014 whose\nwrites no allow rule can pre-approve; only <code>bypassPermissions</code> lets\nthem through.</p>\n","example":{"label":"Locking the modes down org-wide","lang":"json","code":"// managed-settings.json \u2014 deployed by an administrator\n{\n  \"permissions\": {\n    \"disableBypassPermissionsMode\": \"disable\",\n    \"disableAutoMode\": \"disable\",\n    \"defaultMode\": \"default\"\n  }\n}"},"takeaway":"dontAsk denies instead of prompting. plan never auto-approves edits, even with a matching allow rule.","checks":[{"q":"Which mode auto-DENIES anything not already pre-approved?","choices":["plan","acceptEdits","dontAsk","bypassPermissions"],"answer":[2],"why":"dontAsk converts any permission prompt into a denial. Tools pre-approved by allow rules still run. It is the right posture for a headless agent where nobody can answer a prompt."},{"q":"In plan mode, an allow rule matches a file edit Claude wants to make. Does it run?","choices":["Yes \u2014 allow rules always win","No \u2014 plan mode never auto-approves file edits, even with a matching allow rule","Only if you are also in acceptEdits","Only for files inside the working directory"],"answer":[1],"why":"Plan mode routes file edits and shell writes to a prompt regardless of allow rules, so write operations cannot be auto-approved while planning. It is a deliberate exception to normal evaluation."}]},{"id":"l9","title":"Settings files, precedence and trust","objective":"Predict which file wins, and explain why a cloned repo cannot silently widen your access.","teach":"\n<p>Five sources hold settings. Highest precedence first:</p>\n<ol>\n<li><b>Managed</b> \u2014 your organization. Nothing overrides it, not even a CLI flag.</li>\n<li><b>Command line</b> \u2014 <code>claude --settings</code></li>\n<li><b>Project local</b> \u2014 <code>.claude/settings.local.json</code> (yours, gitignored)</li>\n<li><b>Shared project</b> \u2014 <code>.claude/settings.json</code> (committed)</li>\n<li><b>User</b> \u2014 <code>~/.claude/settings.json</code></li>\n</ol>\n\n<p><b>Scalars override; lists merge.</b> Set <code>permissions.allow</code> in\nthree files and you get the union of all three. This is why \u201cI removed that\nallow rule and it still applies\u201d almost always means another scope still\ndeclares it.</p>\n\n<p>Now the security question. A repository can ship a\n<code>.claude/settings.json</code>. Cloning it must not silently grant the author\naccess to your machine. So Claude Code splits the file by direction:</p>\n\n<table class=\"tbl\">\n<tr><th>Rules</th><th>When they apply</th></tr>\n<tr><td><code>deny</code> and <code>ask</code></td><td><b>Immediately</b></td></tr>\n<tr><td><code>allow</code>, <code>additionalDirectories</code>, most <code>env</code></td><td><b>Only after you trust the folder</b></td></tr>\n</table>\n\n<p class=\"callout\"><b>Restrictions bind at once; grants wait for a human.</b>\nLearn this asymmetry \u2014 it answers a whole family of questions, and it is the\nprinciple behind several later lessons.</p>\n\n<p>Last thing: settings files are <b>strict JSON</b>. A <code>//</code> comment\nor a trailing comma is a syntax error that surfaces as a Settings Error at your\nnext start.</p>\n","example":{"label":"Which file for which job","lang":"text","code":"~/.claude/settings.json          your preferences, every project\n.claude/settings.json            the team's rules \u2014 commit this\n.claude/settings.local.json      your approvals here \u2014 gitignored\nmanaged-settings.json            org policy \u2014 you cannot override it"},"takeaway":"Managed > CLI > local > project > user. Lists merge. deny/ask apply at once; allow waits for trust.","checks":[{"q":"A teammate clones your repo with a committed .claude/settings.json. Which rules take effect BEFORE they trust the folder?","choices":["deny rules","ask rules","allow rules","additionalDirectories"],"answer":[0,1],"why":"Restrictions bind immediately; grants wait. deny and ask apply at once, while permissions.allow, additionalDirectories, extraKnownMarketplaces and most env values wait for the trust step. Otherwise cloning a repo would silently widen your access."},{"q":"You set permissions.allow in both your user settings and the project's settings.json. What happens?","choices":["The higher-precedence file's list replaces the other","The lists merge \u2014 entries from both apply","Claude Code reports a conflict","Only the user file is read"],"answer":[1],"why":"List keys such as permissions.allow merge across scopes rather than overriding, so each file can contribute entries. Scalar keys follow normal precedence."}]}]},{"id":"m3","title":"Extending Claude Code","blurb":"Four mechanisms \u2014 skills, hooks, subagents, MCP. Each solves a different problem, and choosing the wrong one is the most common mistake.","lessons":[{"id":"l10","title":"Choosing a mechanism","objective":"Given a requirement, name which of the four extension points it belongs to.","teach":"\n<p>Before the details, the decision. Four mechanisms, four different jobs:</p>\n\n<table class=\"tbl\">\n<tr><th>You want\u2026</th><th>Use</th><th>Because</th></tr>\n<tr><td>Claude to know a fact, always</td><td><b>CLAUDE.md</b></td><td>loaded every session</td></tr>\n<tr><td>A repeatable procedure, on demand</td><td><b>Skill</b></td><td>loads only when invoked \u2014 costs nothing until used</td></tr>\n<tr><td>Something to happen <em>every time</em>, guaranteed</td><td><b>Hook</b></td><td>the harness runs it as code; Claude cannot forget</td></tr>\n<tr><td>Work done without polluting your context</td><td><b>Subagent</b></td><td>separate context window; returns a conclusion</td></tr>\n<tr><td>Access to an external system</td><td><b>MCP</b></td><td>connects real tools and data</td></tr>\n</table>\n\n<p>The two failure modes are worth naming now, because both are common:</p>\n\n<p><b>Putting a procedure in CLAUDE.md.</b> It works, but you pay its tokens on\nevery turn of every session forever, and adherence drops as the file grows. If a\nsection of your CLAUDE.md has become a numbered procedure rather than a fact,\nthat is the signal to make it a skill.</p>\n\n<p><b>Putting a guarantee in a prompt.</b> \u201cAlways run the linter\u201d in CLAUDE.md,\nin your prompt, or in a skill is a request. Only a hook is a guarantee. If the\nanswer to \u201cwhat if Claude doesn't?\u201d is \u201cthat's a problem\u201d, you need a hook.</p>\n","example":{"label":"The same requirement, three ways","lang":"text","code":"\"We use pnpm, not npm\"\n  -> CLAUDE.md. A fact, always relevant, one line.\n\n\"Here is our 12-step release procedure\"\n  -> Skill. Long, only relevant when releasing, loads on demand.\n\n\"Never let a commit through without the linter passing\"\n  -> Hook. A guarantee. PostToolUse on Edit|Write, or PreToolUse on\n     Bash(git commit *)."},"takeaway":"Facts \u2192 CLAUDE.md. Procedures \u2192 skills. Guarantees \u2192 hooks. Context isolation \u2192 subagents. External systems \u2192 MCP.","checks":[{"q":"A section of your CLAUDE.md has grown into a numbered 12-step deployment procedure. What should you do?","choices":["Leave it \u2014 CLAUDE.md is the right home for instructions","Move it to a skill, so it loads only when you invoke it","Move it to a hook","Split it across several CLAUDE.md files"],"answer":[1],"why":"A skill's body loads only when used, so long reference material costs almost nothing until you need it. A CLAUDE.md section costs its tokens on every turn of every session. 'A section that has become a procedure rather than a fact' is the documented signal to convert it."}]},{"id":"l11","title":"Skills","objective":"Write a skill, and explain the two different lifetimes inside it.","teach":"\n<p>A skill is a markdown file with YAML frontmatter that becomes a slash command.\n<code>.claude/skills/deploy/SKILL.md</code> gives you <code>/deploy</code>.</p>\n\n<p>(Custom commands were merged into skills. A file at\n<code>.claude/commands/deploy.md</code> does the same thing and still works; the\nskill form adds a directory for supporting files and richer frontmatter.)</p>\n\n<p>Claude can invoke a skill itself when it seems relevant \u2014 which you often do\n<em>not</em> want for anything with side effects. Hence:</p>\n\n<pre class=\"mini\">disable-model-invocation: true   # only you can trigger it</pre>\n\n<p>Now the part that gets tested. A skill has <b>two different lifetimes</b>:</p>\n\n<table class=\"tbl\">\n<tr><th></th><th>Lifetime</th></tr>\n<tr><td>The skill's <b>content</b></td><td>Enters the conversation once and <b>stays for the whole session</b>. Claude Code never re-reads the file.</td></tr>\n<tr><td>Its <code>allowed-tools</code> <b>grant</b></td><td>Applies to <b>the invoking turn only</b>. Clears when you send your next message.</td></tr>\n</table>\n\n<p>The practical consequence: <b>write standing instructions, not one-time\nsteps.</b> \u201cFirst, read the changelog\u201d reads fine on turn one and badly on turn\nnine, because the text is still sitting there. Write \u201cAlways prefer X over Y\u201d\ninstead.</p>\n\n<p><b>Arguments</b> use <code>$ARGUMENTS</code> for the whole string, or\n<code>$ARGUMENTS[N]</code> / <code>$N</code> for one by index \u2014 <b>0-based</b>, so\n<code>$0</code> is the <em>first</em> argument. If you pass arguments and the body\nhas no placeholder, Claude Code appends <code>ARGUMENTS: your text</code> so\nnothing is lost.</p>\n\n<p class=\"callout\"><b>Security note.</b> Workspace trust does <em>not</em> gate\n<code>allowed-tools</code>. A skill committed to a repository applies its grant\nwhenever it is invoked \u2014 including in a <code>-p</code> run in a folder you have\nnever trusted. Read the <code>allowed-tools</code> of repository skills before\nrunning Claude Code there.</p>\n","example":{"label":"A skill with a scoped, prompt-free grant","lang":"markdown","code":"---\nname: commit\ndescription: Stage and commit the current changes with a conventional message.\nargument-hint: \"[scope]\"\ndisable-model-invocation: true\nallowed-tools: Bash(git add *) Bash(git commit *) Bash(git status *)\n---\n\nReview the staged changes and commit them.\n\n- Write a conventional-commit subject line, scoped to $ARGUMENTS if given.\n- Never commit files the user did not stage.\n- If nothing is staged, say so and stop \u2014 do not stage anything yourself."},"takeaway":"Skill content persists all session; its allowed-tools grant lasts one turn. $0 is the first argument.","checks":[{"q":"How long does a skill's allowed-tools grant last?","choices":["The whole session","Only the turn that invoked the skill \u2014 it clears at your next message","Until the skill is invoked again","Permanently, once written to settings"],"answer":[1],"why":"The grant covers the invoking turn and clears when you send your next message, even though the skill's CONTENT stays in context for the whole session. To pre-approve for a whole session, use permission settings instead."},{"q":"Your skill body says 'First, read the changelog.' On turn nine Claude reads it again unprompted. Why?","choices":["A bug in skill handling","The rendered skill content stays in the conversation for the session, so a one-time step reads as a standing instruction forever","The skill was invoked twice","Because allowed-tools was still active"],"answer":[1],"why":"The rendered SKILL.md enters the conversation as one message and persists; Claude Code does not re-read the file on later turns. Write guidance as standing instructions rather than sequenced steps."},{"q":"In a skill body, what does $1 expand to?","choices":["The first argument","The second argument \u2014 indexing is 0-based","The literal text '$1'","The full argument string"],"answer":[1],"why":"$N is shorthand for $ARGUMENTS[N] and indexing is 0-based, so $0 is first and $1 is second. Bare $ARGUMENTS is the whole string as typed."}]},{"id":"l12","title":"Hooks \u2014 the guarantee mechanism","objective":"Write a hook that blocks a tool call, and read its exit codes correctly.","teach":"\n<p>A hook is code the <b>harness</b> runs at a fixed lifecycle point. That is the\nentire reason it exists: \u201cplease always run the linter\u201d is a request Claude can\nforget; a <code>PostToolUse</code> hook cannot.</p>\n\n<p>Configuration nests three levels: <b>event</b> \u2192 <b>matcher group</b> \u2192\n<b>handler</b>.</p>\n\n<p>The events you will actually use:</p>\n<ul>\n<li><code>PreToolUse</code> \u2014 before a call. <b>Can block.</b></li>\n<li><code>PostToolUse</code> \u2014 after success. (Failures fire <code>PostToolUseFailure</code>.)</li>\n<li><code>UserPromptSubmit</code> \u2014 before Claude sees your prompt. Can block or rewrite it.</li>\n<li><code>SessionStart</code> / <code>SessionEnd</code>, <code>PreCompact</code> / <code>PostCompact</code>, <code>SubagentStart</code> / <code>SubagentStop</code></li>\n</ul>\n\n<p>Your hook receives the event as JSON on <b>stdin</b> and communicates back two\nways.</p>\n\n<p><b>Exit codes</b> \u2014 three outcomes, and the third is the trap:</p>\n<table class=\"tbl\">\n<tr><th>Exit</th><th>Meaning</th></tr>\n<tr><td><code>0</code></td><td>Success. stdout is parsed as JSON for structured control.</td></tr>\n<tr><td><code>2</code></td><td><b>Blocking error.</b> The call is stopped.</td></tr>\n<tr><td>anything else</td><td><b>Non-blocking</b> error \u2014 reported, and the action <b>proceeds</b>.</td></tr>\n</table>\n\n<p class=\"callout\">A hook with a typo that exits 1 does not fail loudly. It\nsilently stops protecting you.</p>\n\n<p><b>Structured JSON</b> is the richer path \u2014 it lets you deny <em>with a\nreason Claude can act on</em>, or even rewrite the tool's input.</p>\n\n<p>Matchers are worth one line of care: a matcher of only letters, digits,\n<code>_</code>, <code>-</code>, spaces, commas or pipes is an exact string or\nlist (<code>Edit|Write</code>). Anything else is compiled as an <b>unanchored\nJavaScript regex</b> (<code>^Notebook.*</code>).</p>\n","example":{"label":"A PreToolUse hook that denies with a reason","lang":"bash","code":"#!/usr/bin/env bash\n# .claude/hooks/block-force-push.sh\nset -uo pipefail\n\ncommand=$(jq -r '.tool_input.command // \"\"')\n\nif printf '%s' \"$command\" | grep -q -- '--force'; then\n  jq -n '{\n    hookSpecificOutput: {\n      hookEventName: \"PreToolUse\",\n      permissionDecision: \"deny\",\n      permissionDecisionReason: \"Force push blocked. Use --force-with-lease.\"\n    }\n  }'\nfi\nexit 0   # no output = no decision; the normal permission flow applies"},"takeaway":"Exit 0 = success (JSON read), 2 = block, anything else = the action proceeds anyway.","checks":[{"q":"Your hook script has a typo and exits with status 1. Does the tool call still run?","choices":["No \u2014 any non-zero exit blocks","Yes \u2014 only 2 is a blocking error; every other non-zero code is non-blocking and the action proceeds","It retries the hook","The session ends"],"answer":[1],"why":"Only 0 (success) and 2 (blocking error) are special. Every other exit code is a non-blocking error: it is reported, and the action proceeds. A broken hook silently stops protecting you \u2014 which is why you test hooks by piping JSON into them."},{"q":"Which JSON does a PreToolUse hook emit to deny a call with a reason?","choices":["{\"decision\": \"deny\", \"reason\": \"...\"}","{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"...\"}}","{\"block\": true}","{\"continue\": false}"],"answer":[1],"why":"PreToolUse uses hookSpecificOutput with permissionDecision and permissionDecisionReason, and can also supply updatedInput to rewrite the call. The bare {decision, reason} shape belongs to the PermissionRequest event."}]},{"id":"l13","title":"Hooks vs. rules \u2014 the precedence you must know","objective":"Predict the outcome when a hook and a permission rule disagree, in both directions.","teach":"\n<p>Hooks and permission rules both gate tool calls, so what happens when they\ndisagree? The answer is asymmetric, and both halves are tested.</p>\n\n<p><b>Direction 1 \u2014 a hook says allow, a deny rule matches.</b></p>\n<p class=\"rule-flow\">Deny rule wins. The call is blocked.</p>\n<p>Hook decisions do not bypass permission rules. Claude Code evaluates deny and\nask rules regardless of what a <code>PreToolUse</code> hook returned. Deny-first\nprecedence is preserved, including for deny rules from managed settings.</p>\n\n<p><b>Direction 2 \u2014 a hook exits 2, an allow rule matches.</b></p>\n<p class=\"rule-flow\">Hook wins. The call is blocked.</p>\n<p>An exit-2 hook stops the call <em>before</em> permission rules are evaluated\nat all.</p>\n\n<p>Read those together and the principle is clean: <b>restrictions win in both\ndirections.</b> Nothing you configure can make a call run that something else\nwanted blocked.</p>\n\n<p>And that asymmetry is what solves the problem from Lesson 5 \u2014 \u201callow all of X\nexcept Y\u201d, which deny rules alone cannot express:</p>\n\n<p class=\"callout\"><b>The pattern:</b> put <code>\"Bash\"</code> in your\n<code>allow</code> list, then register a <code>PreToolUse</code> hook that\nrejects the specific cases. The allow rule handles the common path with no\nprompts; the hook, running first, catches the exceptions with the full\nexpressive power of code rather than a glob.</p>\n","example":{"label":"Allow-with-exceptions","lang":"json","code":"{\n  \"permissions\": { \"allow\": [\"Bash\"] },\n\n  \"hooks\": {\n    \"PreToolUse\": [{\n      \"matcher\": \"Bash\",\n      \"hooks\": [{\n        \"type\": \"command\",\n        \"command\": \"${CLAUDE_PROJECT_DIR}/.claude/hooks/gate.sh\",\n        \"args\": []\n      }]\n    }]\n  }\n}\n\n// gate.sh inspects the whole command and exits 2 for the cases you\n// refuse \u2014 something a prefix glob could never express safely."},"takeaway":"Hook 'allow' loses to a deny rule; hook exit 2 beats an allow rule. Restrictions win in both directions.","checks":[{"q":"A PreToolUse hook returns permissionDecision 'allow', but a project deny rule also matches. What happens?","choices":["The hook wins and the call runs","The deny rule wins and the call is blocked","You are prompted","Claude Code errors"],"answer":[1],"why":"Hook decisions do not bypass permission rules. Deny and ask rules are evaluated regardless of what a PreToolUse hook returns, preserving deny-first precedence."},{"q":"You want every Bash command to run without prompting EXCEPT a handful you consider dangerous. What is the documented approach?","choices":["Add 'Bash' to allow, and a PreToolUse hook that exits 2 for the dangerous cases","Add 'Bash' to allow plus narrower deny rules \u2014 allow wins for everything else","Use bypassPermissions with a PostToolUse hook","Not possible \u2014 allow and deny cannot combine on one tool"],"answer":[0],"why":"A hook exiting 2 stops the call before permission rules are evaluated, so it overrides the allow rule. Deny rules cannot do this, because a deny rule cannot carry allowlist exceptions \u2014 a broad deny blocks everything it matches."}]},{"id":"l14","title":"Subagents","objective":"Say what a subagent does and does not receive, and when the handoff is worth it.","teach":"\n<p>A subagent is a specialized assistant with <b>its own context window</b>. You\nreach for one for two reasons: a task produces output you do not want in your\nmain conversation, or you want to hard-limit what a piece of work can touch.</p>\n\n<p>Defined as markdown with frontmatter in <code>.claude/agents/</code>. Only\n<code>name</code> and <code>description</code> are required.</p>\n\n<p><b>The constraint is structural, not persuasive.</b> Setting\n<code>tools: Read, Grep, Glob</code> removes the write tools from the agent's\npool entirely. A confused agent, a bad prompt, or injected text in a file it\nreads cannot make it write. That is a different kind of guarantee from asking it\nnicely.</p>\n\n<p>What crosses the boundary matters:</p>\n<table class=\"tbl\">\n<tr><th>Receives</th><th>Does not receive</th></tr>\n<tr><td>Its own system prompt</td><td><b>The main conversation history</b></td></tr>\n<tr><td>The task message Claude writes for it</td><td>Output style preferences</td></tr>\n<tr><td><code>CLAUDE.md</code> (except Explore/Plan)</td><td>Auto memory from the main session</td></tr>\n<tr><td>A git status snapshot</td><td>Skills invoked earlier in the main session</td></tr>\n</table>\n\n<p class=\"callout\">A subagent <b>cannot call <code>AskUserQuestion</code></b> \u2014 it\nis removed, along with <code>EndConversation</code>, plan-mode tools and\n<code>Workflow</code>. So design its prompt to resolve its own ambiguity, or to\nreport both readings and let the main session decide. It cannot stop and ask.</p>\n\n<p><b>@-mention guarantees</b> a specific subagent runs; relying on the\ndescription means Claude decides. <code>model</code> defaults to\n<code>inherit</code> \u2014 routing verbose mechanical work to a faster model is a\nreal cost lever.</p>\n\n<p>And when <em>not</em> to: a subagent starting from a blank context has to\nrediscover what you already know. For a small edit in a file you are looking at,\nthe handoff costs more than it saves.</p>\n","example":{"label":"An agent that cannot write, by construction","lang":"markdown","code":"---\nname: notes-auditor\ndescription: Audit the notes in docs/ against the code and report drift.\n             Use when asked whether documentation is still accurate.\ntools: Read, Grep, Glob\nmodel: inherit\n---\n\nYou audit documentation against the code it describes.\n\nReport only \u2014 you have no write tools and must not ask for them.\nProposing an edit is the main session's job, not yours.\n\nFor each finding give file:line for both sides, then your judgement of\nwhich is correct. If you find nothing, say so in one sentence."},"takeaway":"Own context window, no conversation history, cannot ask questions. Tool limits are structural, not advisory.","checks":[{"q":"Your subagent needs to ask the user which of two readings they meant. How does it do that?","choices":["With AskUserQuestion","It cannot \u2014 that tool is removed from every subagent; design the prompt to resolve or report both readings","By returning a special exit code","By spawning a sub-subagent"],"answer":[1],"why":"AskUserQuestion is removed from every subagent, along with EndConversation, the plan-mode tools, ScheduleWakeup and Workflow. A subagent's prompt must resolve its own ambiguity or report both options for the main session to decide."},{"q":"What does a non-fork subagent NOT receive?","choices":["The main conversation history","CLAUDE.md files","A git status snapshot","Skills previously invoked in the main session"],"answer":[0,3],"why":"It gets a fresh context: its own system prompt, the task message, CLAUDE.md (except Explore and Plan), a git status snapshot, and any preloaded skills. It does not get the main conversation history, output style, auto memory, or skills invoked earlier. A fork is the variant that DOES inherit the full history."}]},{"id":"l15","title":"MCP","objective":"Add a server, name its tools in a rule, and explain the approval asymmetry.","teach":"\n<p>MCP \u2014 the Model Context Protocol \u2014 is an open standard for connecting Claude\nto external systems. Connect a server when you find yourself copying data into\nchat from somewhere else.</p>\n\n<p>Four transports, added four ways:</p>\n<pre class=\"mini\">claude mcp add --transport http  notion https://mcp.notion.com/mcp\nclaude mcp add --transport sse    asana https://mcp.asana.com/sse\nclaude mcp add --transport stdio  local -- npx -y my-server\nclaude mcp add-json events '{\"type\":\"ws\",\"url\":\"wss://\u2026\"}'</pre>\n\n<p>For stdio servers the bare <code>--</code> separates Claude's own flags from\nthe server's command line; everything after it is passed through untouched.\n(<code>--transport</code> does not accept <code>ws</code> \u2014 WebSocket servers must\ngo through <code>add-json</code> or <code>.mcp.json</code>.)</p>\n\n<p><b>Tools are named <code>mcp__&lt;server&gt;__&lt;tool&gt;</code></b> \u2014\n<code>mcp__github__get_issue</code>. That naming is what permission rules and hook\nmatchers must use. And allow globs need a <b>literal, glob-free server\nsegment</b>: <code>mcp__github__get_*</code> works, <code>mcp__*</code> is skipped\nwith a warning and approves nothing.</p>\n\n<p><b>Three scopes:</b> <code>local</code> (default, private to you),\n<code>project</code> (writes <code>.mcp.json</code> at the repo root, meant to be\ncommitted), and <code>user</code> (all your projects).</p>\n\n<p class=\"callout\"><b>The asymmetry that matters.</b> Project-scoped servers from\n<code>.mcp.json</code> prompt for approval in <b>interactive</b> sessions.\n<code>claude -p</code>, Agent SDK sessions and cloud sessions <b>cannot show that\nprompt, so they load them without asking.</b></p>\n\n<p>Read that twice. A <code>.mcp.json</code> in a repo you cloned is a request to\nrun someone else's code, and CI is exactly the place where nobody sees the\nprompt. To exclude a server regardless of mode, use\n<code>disabledMcpjsonServers</code>.</p>\n","example":{"label":"Project config and a matching allow rule","lang":"json","code":"// .mcp.json \u2014 committed, shared with the team\n{\n  \"mcpServers\": {\n    \"github\": { \"type\": \"http\", \"url\": \"https://api.githubcopilot.com/mcp/\" }\n  }\n}\n\n// .claude/settings.json \u2014 approve only the read-only tools\n{\n  \"permissions\": {\n    \"allow\": [\"mcp__github__get_*\", \"mcp__github__list_*\"]\n  }\n}"},"takeaway":"mcp__server__tool naming. Project servers prompt interactively but load silently under -p, the SDK and cloud.","checks":[{"q":"A repo contains .mcp.json. In which contexts do those servers load WITHOUT an approval prompt?","choices":["An interactive terminal session","A `claude -p` run","An Agent SDK session","A cloud session"],"answer":[1,2,3],"why":"Interactive sessions prompt before using project-scoped servers. Non-interactive contexts cannot show that prompt, so they load them without asking \u2014 which is why a .mcp.json from an untrusted repo is a real supply-chain concern in CI."},{"q":"Which MCP allow rule actually auto-approves tools?","choices":["mcp__*","mcp__github__get_*","\"*\"","mcp__*__get_issue"],"answer":[1],"why":"Allow rules accept tool-name globs only after a literal mcp__<server>__ prefix, and the server segment must be glob-free. Unanchored globs are skipped with a warning and approve nothing."}]}]},{"id":"m4","title":"Running it without you","blurb":"Headless runs, CI, and the security posture that changes the moment no human is watching a prompt.","lessons":[{"id":"l16","title":"Headless mode","objective":"Run Claude Code from a script and consume its structured output.","teach":"\n<p>Add <code>-p</code> (or <code>--print</code>) and Claude Code runs\nnon-interactively: prompt in, result out, exit.</p>\n\n<pre class=\"mini\">claude -p \"Find and fix the bug in auth.py\" --allowedTools \"Read,Edit\"</pre>\n\n<p>It behaves like a Unix tool. stdin is read (capped at <b>10MB</b>), exit code\n0 on success and non-zero on failure, so scripts can branch on it.</p>\n\n<p><b>Output formats:</b></p>\n<table class=\"tbl\">\n<tr><th><code>--output-format</code></th><th>Gives you</th></tr>\n<tr><td><code>text</code> (default)</td><td>plain text</td></tr>\n<tr><td><code>json</code></td><td><code>result</code>, <code>session_id</code>, usage, <code>total_cost_usd</code></td></tr>\n<tr><td><code>stream-json</code></td><td>newline-delimited events; the last line is the <code>result</code></td></tr>\n</table>\n\n<p>Add <code>--json-schema</code> to constrain the answer; it arrives in\n<code>structured_output</code>.</p>\n\n<p><b>Sessions persist across invocations</b>, so a script can hold a\nconversation:</p>\n<pre class=\"mini\">id=$(claude -p \"Start a review\" --output-format json | jq -r '.session_id')\nclaude -p \"Now check the database queries\" --resume \"$id\"</pre>\n\n<p>One quiet failure mode to know now: <b>a plugin or MCP server that fails to\nload does not fail the run.</b> The <code>system/init</code> event carries\n<code>plugin_errors</code> and <code>mcp_server_errors</code>; a CI gate has to\ncheck them itself.</p>\n","example":{"label":"Claude as a linter in package.json","lang":"json","code":"{\n  \"scripts\": {\n    \"lint:claude\": \"git diff main | claude -p --bare \\\"you are a typo linter. for each typo in this diff, report filename:line on one line and the issue on the next. return nothing else.\\\"\"\n  }\n}"},"takeaway":"-p makes Claude Code a Unix tool. json/stream-json give you structured output; load errors do not fail the run.","checks":[{"q":"Your CI run passes --mcp-config and one server fails validation. What happens?","choices":["The run aborts with a non-zero exit","The server is skipped, the run continues and exits cleanly \u2014 check mcp_server_errors yourself","Claude Code prompts for confirmation","The server is retried until it connects"],"answer":[1],"why":"Invalid entries are skipped and the run continues and exits cleanly. The system/init event carries mcp_servers/mcp_server_errors and plugins/plugin_errors, and a CI gate must fail on a non-empty errors array itself. When a CI runner captures stderr, no warning is printed at all."}]},{"id":"l17","title":"Why CI needs --bare","objective":"Explain the specific risk of a non-bare -p run and write a hardened command.","teach":"\n<p>This lesson is one fact, and it is the most security-relevant thing in the\ncourse.</p>\n\n<p class=\"callout\"><b>Without <code>--bare</code>, a <code>claude -p</code> run\nexecutes the hooks in a project's <code>.claude/settings.json</code> and connects\nthe servers in its <code>.mcp.json</code> \u2014 in a folder you have never trusted,\nwith no workspace-trust dialog and no per-server approval prompt.</b></p>\n\n<p>Now recall Lesson 9: <code>deny</code> and <code>ask</code> bind immediately,\nbut <code>allow</code> waits for trust. That protection depends on a human being\nable to grant trust. Under <code>-p</code>, <b>trust verification is\ndisabled</b> \u2014 because there is no way to show the dialog.</p>\n\n<p>Put those together and think about CI running against a pull request from a\nfork. The attacker controls <code>.claude/settings.json</code> and\n<code>.mcp.json</code> in that branch.</p>\n\n<p><b><code>--bare</code> is the answer.</b> It skips auto-discovery of hooks,\nskills, commands, subagents, plugins, MCP servers, auto memory and CLAUDE.md.\nIt is the recommended mode for scripted and SDK calls, and is slated to become\nthe default for <code>-p</code>.</p>\n\n<p>One consequence: in bare mode Claude Code <b>never reads OAuth credentials or\nthe system keychain</b>. Set <code>ANTHROPIC_API_KEY</code>. (Bedrock, Google\nCloud and Foundry still read their own provider credentials.)</p>\n\n<p>The rest of a hardened run:</p>\n<ul>\n<li><code>-p</code> starts in <b>Manual mode on every plan</b> \u2014 so pin the mode.\n<code>--permission-mode dontAsk</code> denies rather than prompting.</li>\n<li>Narrow the tools. Better still, <b>pipe the input in</b> so the run needs no\nBash permission at all to see it.</li>\n<li>Cap the blast radius: <code>--max-turns</code>, <code>--max-budget-usd</code>.</li>\n</ul>\n","example":{"label":"A run you could point at an untrusted PR","lang":"bash","code":"git diff main | claude \\\n  --bare \\\n  -p \"Review this diff for correctness bugs. Report file:line and one line each.\" \\\n  --permission-mode dontAsk \\\n  --allowedTools \"Read\" \\\n  --max-turns 12 \\\n  --max-budget-usd 2 \\\n  --output-format json\n\n# --bare      repo config does not execute\n# dontAsk     anything unlisted is denied, not queued for a prompt nobody sees\n# piped diff  no Bash permission needed to read the change\n# caps        a runaway loop cannot spend your afternoon"},"takeaway":"Without --bare, a -p run executes untrusted repo hooks and MCP servers, and trust verification is off under -p.","checks":[{"q":"Which safeguard is explicitly DISABLED when running with -p?","choices":["The permission system","Trust verification for first-time codebases and new MCP servers","Deny rules","Credential storage"],"answer":[1],"why":"Trust verification is disabled non-interactively because the dialog cannot be shown. Combined with a non-bare run executing the repo's hooks and .mcp.json servers, that is exactly why --bare is the correct default for CI."},{"q":"You add --bare and authentication now fails, though you are logged in interactively. Why?","choices":["--bare requires --model","In bare mode Claude Code never reads OAuth credentials or the keychain \u2014 set ANTHROPIC_API_KEY","-p does not support authentication","Bare mode only works on Bedrock"],"answer":[1],"why":"Bare mode does not use your subscription login. Set ANTHROPIC_API_KEY or supply an apiKeyHelper in --settings JSON. Bedrock, Google Cloud and Foundry continue reading their own provider credentials."}]},{"id":"l18","title":"Context at scale","objective":"Predict what survives compaction and choose the right tool to keep a long session healthy.","teach":"\n<p>Long sessions fill the window, and Claude Code compacts: it summarizes the\nconversation history to fit. What happens to your carefully placed instructions\ndepends entirely on <em>how they were loaded</em>.</p>\n\n<table class=\"tbl\">\n<tr><th>Mechanism</th><th>After compaction</th></tr>\n<tr><td>System prompt and output style</td><td>Unchanged \u2014 never part of message history</td></tr>\n<tr><td>Project-root CLAUDE.md, unscoped rules</td><td><b>Re-injected from disk</b></td></tr>\n<tr><td>Auto memory</td><td><b>Re-injected from disk</b></td></tr>\n<tr><td>Rules with <code>paths:</code> frontmatter</td><td><b>Lost</b> until a matching file is read again</td></tr>\n<tr><td>Nested CLAUDE.md in subdirectories</td><td><b>Lost</b> until a file there is read again</td></tr>\n<tr><td>Invoked skill bodies</td><td>Re-injected \u2014 capped at 5,000 tokens per skill, 25,000 total, oldest dropped first</td></tr>\n<tr><td>Hooks</td><td>N/A \u2014 hooks are code, not context</td></tr>\n</table>\n\n<p>Two things follow that you can act on:</p>\n\n<p><b>If a rule must survive compaction, drop its <code>paths:</code>\nfrontmatter</b> or move it to the project-root CLAUDE.md. Path-scoped rules enter\nmessage history when their trigger file is read, so compaction summarizes them\naway like anything else.</p>\n\n<p><b>Skill truncation keeps the START of the file.</b> Put the load-bearing\ninstructions near the top of <code>SKILL.md</code>, never in a closing section.</p>\n\n<p>The levers, roughly in order of how much they buy you:</p>\n<ul>\n<li><b>Subagents</b> \u2014 the structural fix. Reading happens in another window.</li>\n<li><b>Skills</b> \u2014 bodies load on demand, so reference material is free until used.</li>\n<li><b>Tool search</b> \u2014 MCP schemas stay deferred; only names load at startup.</li>\n<li><code>/context</code> to diagnose, <code>/compact</code> to continue,\n<code>/clear</code> when the task changed.</li>\n</ul>\n","example":{"label":"A rule that survives, and one that does not","lang":"markdown","code":"<!-- .claude/rules/api.md \u2014 LOST after compaction until a match is read -->\n---\npaths:\n  - \"src/api/**/*.ts\"\n---\nAll API endpoints must validate input.\n\n<!-- .claude/rules/always.md \u2014 no paths: field, so re-injected from disk -->\nNever write to the balances table directly; go through src/ledger/."},"takeaway":"Path-scoped rules and nested CLAUDE.md are lost to compaction; project-root CLAUDE.md and auto memory are re-injected.","checks":[{"q":"After a /compact, which of these is LOST until its trigger fires again?","choices":["Project-root CLAUDE.md","Auto memory","A rule with paths: frontmatter","The system prompt"],"answer":[2],"why":"Project-root CLAUDE.md, unscoped rules and auto memory are re-injected from disk. The system prompt is never in message history. Path-scoped rules and nested CLAUDE.md entered message history when their trigger file was read, so compaction summarizes them away."},{"q":"Where should the most important instructions go in a long SKILL.md, and why?","choices":["At the end, so they are read last","Near the top \u2014 compaction truncates skill bodies from the start, keeping the beginning","In the frontmatter","It does not matter"],"answer":[1],"why":"Skill bodies are re-injected after compaction but truncated to a 5,000-token per-skill cap, and truncation keeps the START of the file. Anything in a closing section is what gets dropped."}]}]},{"id":"m5","title":"The API and the SDKs","blurb":"Claude Code is one way to use Claude. The exam also covers calling the API directly and building agents on it.","lessons":[{"id":"l19","title":"The Messages API","objective":"Read a response correctly and handle the stop reasons that matter.","teach":"\n<p>Everything goes through one endpoint: <code>POST /v1/messages</code>. Tool\nuse, extended thinking, caching and structured outputs are all <b>features of\nthat endpoint</b>, not separate APIs.</p>\n\n<p>The API is <b>stateless</b> \u2014 you resend the full conversation every time.\nThat single fact is why caching and context management matter as much as they\ndo.</p>\n\n<p><b>The first bug everyone writes</b> is <code>response.content[0].text</code>.\n<code>content</code> is a <em>list of blocks</em> \u2014 thinking, text, tool_use \u2014\nand with thinking on, block 0 is usually a thinking block. Iterate and check\n<code>block.type</code>.</p>\n\n<p><b>Stop reasons</b> you must handle:</p>\n<table class=\"tbl\">\n<tr><td><code>end_turn</code></td><td>finished naturally</td></tr>\n<tr><td><code>tool_use</code></td><td>execute the tool and continue the loop</td></tr>\n<tr><td><code>max_tokens</code></td><td>truncated mid-thought \u2014 you pay for the retry too</td></tr>\n<tr><td><code>pause_turn</code></td><td>a server-side tool paused; resend to resume. <b>Looks like an ending and is not.</b></td></tr>\n<tr><td><code>refusal</code></td><td>a safety decline. <b>Arrives as HTTP 200</b>, not an exception.</td></tr>\n</table>\n\n<p>Two current-generation details that catch
