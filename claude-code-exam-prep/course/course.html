 people out: <b>prefill is removed</b>\n(seeding the assistant turn returns a 400 \u2014 use structured outputs instead), and\n<b><code>effort</code> lives inside <code>output_config</code></b>, not at the\ntop level.</p>\n","example":{"label":"A correct first call","lang":"python","code":"import anthropic\n\nclient = anthropic.Anthropic()\n\nresponse = client.messages.create(\n    model=\"claude-opus-5\",\n    max_tokens=16000,\n    system=\"You are a concise technical writer.\",\n    thinking={\"type\": \"adaptive\"},        # not budget_tokens \u2014 that is a 400 now\n    output_config={\"effort\": \"medium\"},   # inside output_config, not top level\n    messages=[{\"role\": \"user\", \"content\": \"Explain MCP transports briefly.\"}],\n)\n\nif response.stop_reason == \"refusal\":     # HTTP 200, not an exception\n    raise SystemExit(response.stop_details.category)\n\nfor block in response.content:            # a LIST of blocks\n    if block.type == \"text\":\n        print(block.text)"},"takeaway":"One endpoint, stateless, content is a list of blocks. refusal is a 200; pause_turn is not an ending.","checks":[{"q":"Why is response.content[0].text a common bug?","choices":["content is a string, not a list","content is a LIST of blocks \u2014 with thinking on, block 0 is usually a thinking block","The field is called message, not text","content is only populated when streaming"],"answer":[1],"why":"response.content is a list of content block objects: thinking, text, tool_use. Iterate and check block.type before reading .text."},{"q":"Which stop_reason looks like an ending but is not?","choices":["end_turn","pause_turn","max_tokens","stop_sequence"],"answer":[1],"why":"pause_turn means a server-side tool hit an iteration limit and the turn can be resumed by sending the paused assistant content back. Treating it as terminal gives you a silently truncated answer with no error and no warning."}]},{"id":"l20","title":"Tool use and the agent loop","objective":"Write the agentic loop correctly, including the mistake that degrades it silently.","teach":"\n<p>You define tools; Claude asks to call them; you execute and send results\nback; repeat until it stops asking. That loop <em>is</em> an agent.</p>\n\n<p>A tool is a name, a description and a JSON Schema. <b>The description is the\nhighest-leverage field</b> \u2014 and the trick is to be prescriptive about\n<em>when</em> to call it, not just what it does. Recent models reach for tools\nconservatively, so \u201cCall this when the user asks about current prices\u201d measurably\nraises the should-call rate over \u201cGets prices\u201d.</p>\n\n<p class=\"callout\"><b>The silent degradation.</b> When Claude returns three\n<code>tool_use</code> blocks in one message, all three <code>tool_result</code>\nblocks go back in a <b>single user message</b>. Splitting them across several\nmessages does not error \u2014 it quietly trains Claude to stop making parallel\ncalls, and your agent gets slower over the conversation for no visible reason.</p>\n\n<p>A failed tool still gets a <code>tool_result</code>, with\n<code>is_error: true</code>. Dropping it leaves an unanswered\n<code>tool_use</code> and the next request is rejected.</p>\n\n<p>More generally: <b>return errors as tool results, not as exceptions.</b> An\nuncaught exception aborts the run and the model never learns the tool failed.\nReturning <code>\"error: no records found, ask the user to widen the date range\"</code>\nturns a crash into a conversation.</p>\n","example":{"label":"The loop, and the one-message rule","lang":"python","code":"messages = [{\"role\": \"user\", \"content\": user_input}]\n\nwhile True:\n    response = client.messages.create(\n        model=\"claude-opus-5\", max_tokens=16000,\n        tools=tools, messages=messages,\n    )\n    if response.stop_reason == \"end_turn\":\n        break\n\n    messages.append({\"role\": \"assistant\", \"content\": response.content})\n\n    results = [\n        {\"type\": \"tool_result\", \"tool_use_id\": b.id, \"content\": run(b.name, b.input)}\n        for b in response.content if b.type == \"tool_use\"\n    ]\n    messages.append({\"role\": \"user\", \"content\": results})   # ALL of them, ONE message"},"takeaway":"All parallel tool_results go back in one user message. Return tool errors as results, never as exceptions.","checks":[{"q":"Claude returns three tool_use blocks in one message. How do you return the results?","choices":["One user message per result, in order","All three tool_result blocks in a single user message","As a system message","Under the assistant role"],"answer":[1],"why":"Splitting them across several messages silently trains Claude to stop making parallel calls \u2014 no error, just a gradually more sequential agent. A failed tool still gets a tool_result with is_error: true."}]},{"id":"l21","title":"Prompt caching","objective":"Lay out a request so the cache hits, and diagnose it when it does not.","teach":"\n<p>Caching can cut the cost of a large repeated prefix by up to about 90%. It is\nalso the feature most often silently broken.</p>\n\n<p class=\"rule-flow\">Caching is a <b>prefix match</b>.</p>\n\n<p>Render order is <b>tools \u2192 system \u2192 messages</b>. Any byte change anywhere in\nthe cached prefix invalidates <em>everything after it</em>. So: stable content\nfirst, volatile content after the last breakpoint.</p>\n\n<p><b>Verify, never assume.</b> If <code>usage.cache_read_input_tokens</code> is\nzero across repeated identical-prefix requests, something is invalidating it:</p>\n\n<table class=\"tbl\">\n<tr><th>Invalidator</th><th>Fix</th></tr>\n<tr><td><code>datetime.now()</code> or a UUID in the system prompt</td><td>move it after the breakpoint</td></tr>\n<tr><td><code>json.dumps()</code> on an unsorted dict</td><td><code>sort_keys=True</code></td></tr>\n<tr><td>A tool list built from a set</td><td>sort it</td></tr>\n<tr><td>A prefix under ~1024 tokens</td><td>too short to cache at all</td></tr>\n</table>\n\n<p>Economics: writes cost about <b>1.25\u00d7</b>, reads about <b>0.1\u00d7</b>. Max 4\nbreakpoints. That asymmetry is why a prefix that gets rewritten every turn is\n<em>worse</em> than not caching at all.</p>\n\n<p>Three agent-specific workarounds worth memorizing, because each looks\nharmless and is not:</p>\n<ul>\n<li>Editing the system prompt mid-session invalidates the cache \u2192 append a\n<code>{\"role\": \"system\"}</code> message to <code>messages[]</code> instead.</li>\n<li>Switching models mid-session invalidates it \u2192 spawn a <b>subagent</b> on the\ncheaper model and keep the main loop on one model.</li>\n<li>Adding or removing tools invalidates it \u2192 use <b>tool search</b>, which\n<em>appends</em> schemas rather than swapping them.</li>\n</ul>\n","example":{"label":"Stable first, volatile last","lang":"python","code":"response = client.messages.create(\n    model=\"claude-opus-5\",\n    max_tokens=16000,\n    system=[{\n        \"type\": \"text\",\n        \"text\": BIG_STABLE_CONTEXT,               # never changes between calls\n        \"cache_control\": {\"type\": \"ephemeral\"},   # <- the breakpoint\n    }],\n    messages=[{\"role\": \"user\", \"content\": todays_question}],  # volatile, after it\n)\n\nprint(response.usage.cache_read_input_tokens)   # 0 means something broke it"},"takeaway":"Prefix match, tools\u2192system\u2192messages. Stable first. Verify with cache_read_input_tokens.","checks":[{"q":"Where should volatile content \u2014 a timestamp, the user's question \u2014 go?","choices":["At the very start so the model sees it first","After the last cache_control breakpoint","Anywhere \u2014 the cache keys on content, not position","In the tools array"],"answer":[1],"why":"Render order is tools, then system, then messages, and any byte change in the cached prefix invalidates everything after it. Stable content goes first; volatile content goes after the last breakpoint."},{"q":"cache_read_input_tokens is zero across repeated requests with what should be an identical prefix. Which are plausible causes?","choices":["A datetime.now() or UUID in the system prompt","json.dumps() on an unsorted dict","A tool list built from a set, so its order varies","Using the same model on every request"],"answer":[0,1,2],"why":"Those are the classic silent invalidators, plus a prefix under ~1024 tokens which never caches at all. Keeping the model constant HELPS \u2014 switching models mid-session is itself an invalidator."}]},{"id":"l22","title":"Four ways to build an agent","objective":"Distinguish the Tool Runner, the Claude Agent SDK, and Managed Agents.","teach":"\n<p>Two independent questions separate the options: <b>who supplies the\nharness</b> (the loop and context management), and <b>who supplies the\ndeployment</b> (the infrastructure it runs on).</p>\n\n<table class=\"tbl\">\n<tr><th>Approach</th><th>You write</th><th>Harness / deployment</th></tr>\n<tr><td>Manual loop</td><td>the <code>while</code> loop yourself</td><td>you build it, you host it</td></tr>\n<tr><td><b>Tool Runner</b><br><code>client.beta.messages.tool_runner</code></td><td>just the tool functions</td><td>SDK harness, <b>you host</b></td></tr>\n<tr><td><b>Claude Agent SDK</b><br><code>claude-agent-sdk</code></td><td>a prompt + options</td><td>Claude Code harness, <b>you host</b></td></tr>\n<tr><td><b>Managed Agents</b></td><td>an agent config</td><td>Anthropic harness <b>and</b> hosted sandbox</td></tr>\n</table>\n\n<p class=\"callout\"><b>Tool Runner \u2260 Claude Agent SDK.</b> They sound alike and\nare different packages. Tool Runner lives in the regular Anthropic API SDK and is\na thin helper over <code>POST /v1/messages</code> that loops over tools\n<em>you</em> define \u2014 no built-in tools, no filesystem, no sandbox. The Claude\nAgent SDK is Claude Code packaged as a library: built-in Read/Write/Edit/Bash,\nsubagents, hooks, permissions, sessions.</p>\n\n<p><b>Both are harness-only \u2014 you host and deploy them.</b> Only Managed Agents\nadds managed deployment.</p>\n\n<p>Before choosing the agent tier at all, the docs give four criteria:\n<b>complexity</b> (multi-step and hard to specify up front?), <b>value</b> (does\nit justify the cost and latency?), <b>viability</b> (is Claude good at this?),\nand <b>cost of error</b> (can mistakes be caught?). Any \u201cno\u201d means drop to a\nscripted workflow or a single call. Most production LLM work is a single call.</p>\n","example":{"label":"Tool Runner: you write tools, not loops","lang":"python","code":"from anthropic import Anthropic, beta_tool\n\n@beta_tool\ndef get_weather(location: str, unit: str = \"celsius\") -> str:\n    \"\"\"Get current weather for a location.\n\n    Call this when the user asks about weather, temperature or conditions.\n\n    Args:\n        location: City and state, e.g. San Francisco, CA.\n        unit: Either \"celsius\" or \"fahrenheit\".\n    \"\"\"\n    return f\"18C and raining in {location}\"\n\nrunner = Anthropic().beta.messages.tool_runner(\n    model=\"claude-opus-5\", max_tokens=16000,\n    tools=[get_weather],\n    messages=[{\"role\": \"user\", \"content\": \"Weather in Paris?\"}],\n)\nfor message in runner:      # the SDK drives the loop\n    print(message)\n\n# The docstring IS the tool description. The Args: block IS the schema."},"takeaway":"Tool Runner = API SDK helper, your tools only. Agent SDK = Claude Code as a library. Only Managed Agents hosts it too.","checks":[{"q":"What is the difference between the SDK's Tool Runner and the Claude Agent SDK?","choices":["Two names for the same package","Tool Runner is a helper in the Anthropic API SDK that loops over tools YOU define; the Claude Agent SDK is a separate package shipping the Claude Code harness with built-in file and bash tools","Tool Runner is hosted by Anthropic; the Agent SDK runs locally","Tool Runner is Python-only; the Agent SDK is TypeScript-only"],"answer":[1],"why":"Tool Runner is a thin helper over POST /v1/messages with no built-in tools and no sandbox. The Claude Agent SDK is Claude Code as a library. Both are harness-only \u2014 you host and deploy them; only Managed Agents adds managed deployment."},{"q":"Which approach gives you BOTH a managed agent loop and Anthropic-hosted infrastructure?","choices":["A manual loop","The Tool Runner","Managed Agents","The Claude Agent SDK"],"answer":[2],"why":"The manual loop supplies neither; Tool Runner and the Claude Agent SDK supply a harness but you still host it. Only Managed Agents supplies both \u2014 Anthropic runs the loop and hosts a per-session sandbox."}]},{"id":"l23","title":"The Agent SDK's permission flow","objective":"Order the six steps and avoid the two traps that silently disable your checks.","teach":"\n<p>The Agent SDK's evaluation order is <b>richer than the CLI's</b>\ndeny\u2192ask\u2192allow, and the extra steps are where the traps live.</p>\n\n<ol class=\"steps\">\n<li><b>Hooks</b> \u2014 run first. Can deny outright. A hook returning <code>allow</code> does <b>not</b> skip steps 2 and 3.</li>\n<li><b>Deny rules</b> \u2014 block even in <code>bypassPermissions</code>.</li>\n<li><b>Ask rules</b> \u2014 fall through to your callback, even in <code>bypassPermissions</code>.</li>\n<li><b>Permission mode</b> \u2014 <code>bypassPermissions</code> approves; <code>plan</code> routes edits to the callback regardless of allow rules.</li>\n<li><b>Allow rules</b> \u2014 approve if matched.</li>\n<li><b><code>can_use_tool</code> callback</b> \u2014 only if nothing above resolved it. <b>Skipped entirely in <code>dontAsk</code></b>, which denies instead.</li>\n</ol>\n\n<p class=\"callout\"><b>Trap 1: auto-approved tools never reach\n<code>can_use_tool</code>.</b> A security check in your callback is silently\nbypassed for anything an allow rule, <code>acceptEdits</code> or\n<code>bypassPermissions</code> already approved. A bare entry like\n<code>allowed_tools=[\"Read\"]</code> auto-approves <em>every</em> Read. For a check\nthat must run on every call, use a <code>PreToolUse</code> hook \u2014 hooks run\nbefore every other step.</p>\n\n<p class=\"callout\"><b>Trap 2: <code>allowed_tools</code> does not constrain\n<code>bypassPermissions</code>.</b> Unlisted tools are simply unmatched by an\nallow rule, so they fall through to the mode \u2014 which approves them.\n<code>allowed_tools=[\"Read\"]</code> with <code>bypassPermissions</code> still\npermits Bash, Write and Edit. To block specific tools under bypass, use\n<code>disallowed_tools</code>.</p>\n\n<p>For a genuinely locked-down agent, pair them the other way:\n<code>allowed_tools=[\u2026]</code> with <code>permission_mode=\"dontAsk\"</code>.</p>\n","example":{"label":"Locked down, and the trap beside it","lang":"python","code":"# CORRECT: explicit surface, everything else denied outright\noptions = ClaudeAgentOptions(\n    allowed_tools=[\"Read\", \"Glob\", \"Grep\"],\n    permission_mode=\"dontAsk\",\n)\n\n# TRAP: this approves EVERY tool, including Bash, Write and Edit.\noptions = ClaudeAgentOptions(\n    allowed_tools=[\"Read\"],\n    permission_mode=\"bypassPermissions\",   # unlisted tools fall through to the mode\n)"},"takeaway":"Hooks \u2192 deny \u2192 ask \u2192 mode \u2192 allow \u2192 callback. Auto-approved tools skip the callback; allowed_tools does not constrain bypass.","checks":[{"q":"Put the Agent SDK's permission evaluation steps in order.","choices":["Deny, ask, allow, hooks, mode, canUseTool","Hooks, deny rules, ask rules, permission mode, allow rules, canUseTool","canUseTool, hooks, deny, ask, allow, mode","Permission mode, hooks, deny, ask, allow, canUseTool"],"answer":[1],"why":"Hooks run first and can deny outright, but a hook returning allow does not skip the deny and ask rules below it. The callback is last, and is skipped entirely in dontAsk mode."},{"q":"You put a security check in can_use_tool and set allowed_tools=['Read']. Why might the check never run for Read?","choices":["can_use_tool only fires for Bash","Auto-approved tools never reach the callback \u2014 a bare allow entry approves every call to that tool first","Read is read-only and exempt from checks","The callback must be registered before allowed_tools"],"answer":[1],"why":"Anything approved at an earlier step skips the callback. A bare name like 'Read' auto-approves every Read; a scoped rule like Bash(ls *) only auto-approves matching calls. Use a PreToolUse hook for a check that must run on every call."}]},{"id":"l24","title":"Untrusted content and the sandbox","objective":"Name the injection surfaces and say what the Bash sandbox does that permissions cannot.","teach":"\n<p>The last idea, and the one that ties the course together.</p>\n\n<p class=\"callout\"><b>Everything the model reads is untrusted.</b> Issue bodies,\nPR review comments, CI logs, web pages, MCP tool output, files in a repo you\ncloned. All of it is attacker-influenceable, and all of it must be treated as\n<b>data, never as instructions</b>.</p>\n\n<p>Claude Code's own defences are worth knowing by name: the permission system;\ncontext-aware analysis; <b>network commands like <code>curl</code> and\n<code>wget</code> are not auto-approved</b>; WebFetch runs in an <b>isolated\ncontext window</b> specifically so fetched content cannot inject into your\nconversation; trust verification; command-injection detection even for\npreviously allowlisted commands; and fail-closed matching.</p>\n\n<p>But permissions have a structural limit. They are evaluated <em>before</em> a\ncommand runs, <em>from the command string</em>. They cannot know what a command\nwill actually do.</p>\n\n<p><b>That is what the sandbox adds.</b></p>\n\n<table class=\"tbl\">\n<tr><th></th><th>Controls</th><th>Enforced</th></tr>\n<tr><td>Permission rules</td><td>whether a call runs</td><td>before it, from the command string</td></tr>\n<tr><td><b>Sandbox</b></td><td>what a Bash command can <em>access</em></td><td><b>by the OS, on the running process</b></td></tr>\n</table>\n\n<p>So the sandbox holds <b>regardless of what the model chose to run, and even if\nan allowed command does more than its name suggests</b>. macOS uses Seatbelt,\nLinux and WSL2 use bubblewrap. It covers Bash and its children only \u2014 Read, Edit\nand Write go through the permission system instead.</p>\n\n<p>One rule to carry: in sandbox filesystem policy, <b>a deny holds inside a\nwider allow</b>, and a narrow allow re-opens a denied region. So\n<code>allowRead: [\"~/\"]</code> with <code>denyRead: [\"~/.env\"]</code> gives you\nthe home directory <em>without</em> the secret \u2014 a broad allow cannot silently\nre-expose it.</p>\n\n<p>And the honest caveat: by default the network proxy does not inspect TLS, so\nallowing a broad domain like <code>github.com</code> still creates an\nexfiltration path.</p>\n","example":{"label":"A policy your credentials survive","lang":"json","code":"{\n  \"sandbox\": {\n    \"enabled\": true,\n    \"filesystem\": {\n      \"denyRead\":  [\"~/\"],\n      \"allowRead\": [\"~/code\", \"~/.cache\"]\n    },\n    \"credentials\": {\n      \"files\": [{ \"path\": \"~/.ssh\", \"mode\": \"deny\" }],\n      \"env\":   [{ \"name\": \"GITHUB_TOKEN\", \"mode\": \"deny\" }]\n    },\n    \"network\": { \"allowedDomains\": [\"registry.npmjs.org\"] }\n  }\n}"},"takeaway":"Permissions gate whether a call runs, from its text. The sandbox gates what it can touch, enforced by the OS.","checks":[{"q":"What is the essential difference between a permission rule and the Bash sandbox?","choices":["None \u2014 the sandbox is a permission mode","Permission rules decide whether a call runs, evaluated beforehand from the command string; the sandbox restricts what a running command can access, enforced by the OS on the process","Permission rules are OS-enforced; the sandbox is advisory","The sandbox covers every tool; permission rules cover only Bash"],"answer":[1],"why":"Permission rules are evaluated before a tool runs and apply to every tool. The sandbox is OS-level enforcement on the running process and applies only to Bash and its children \u2014 so it holds regardless of what the model chose to run."},{"q":"Sandbox filesystem policy has allowRead: ['~/'] and denyRead: ['~/.env']. What is readable?","choices":["Everything under home, including ~/.env \u2014 the broader allow wins","Nothing \u2014 the rules conflict","Everything under home except ~/.env \u2014 a deny holds inside a wider allow","Only ~/.env"],"answer":[2],"why":"A deny holds inside a wider allow, so a broad allow cannot silently re-expose a secret. The reverse also works: denyRead ~/ with allowRead ~/projects re-opens that narrower region."},{"q":"Why does WebFetch use a separate context window?","choices":["To reduce latency","To avoid injecting potentially malicious fetched content into the main conversation","Because HTML is large","To enable caching"],"answer":[1],"why":"Isolated context windows for web fetch are a named prompt-injection safeguard: fetched content is analyzed separately rather than dropped into the main conversation where it could act as instructions."}]}]}];
</script>
<script>
(function () {
  "use strict";
  const LETTERS = "abcdefghijklmnopqrstuvwxyz";
  const KEY = "ccpath-v1";
  const el = (id) => document.getElementById(id);

  // Flatten the module tree into a single ordered lesson list.
  const FLAT = [];
  COURSE.forEach((m, mi) =>
    m.lessons.forEach((l) => FLAT.push({ ...l, mod: m, modIndex: mi }))
  );
  const TOTAL = FLAT.length;

  const save = {
    read() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } },
    write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
    wipe() { try { localStorage.removeItem(KEY); } catch (e) {} }
  };

  let state = save.read() || { done: [], at: null };
  if (!Array.isArray(state.done)) state.done = [];

  const isDone = (id) => state.done.includes(id);
  const unlockedCount = () => {
    // A lesson is reachable once every lesson before it is done.
    let n = 0;
    while (n < TOTAL && isDone(FLAT[n].id)) n++;
    return n; // index of the first not-yet-done lesson
  };
  const isUnlocked = (i) => i <= unlockedCount();

  let cursor = null;          // null = intro screen
  let answered = {};          // per-render check state

  // ---------------------------------------------------------------- rail
  function renderNav() {
    const nav = el("nav");
    nav.textContent = "";
    let idx = 0;
    COURSE.forEach((m, mi) => {
      const wrap = document.createElement("div");
      wrap.className = "mod";
      const h = document.createElement("div");
      h.className = "mod-h";
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = "0" + (mi + 1);
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = m.title;
      h.append(n, t);
      const ol = document.createElement("ol");

      m.lessons.forEach((l) => {
        const i = idx++;
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "nav-l" + (isDone(l.id) ? " done" : "");
        b.disabled = !isUnlocked(i);
        if (cursor === i) b.setAttribute("aria-current", "true");
        const st = document.createElement("span");
        st.className = "st";
        const tx = document.createElement("span");
        tx.textContent = l.title;
        b.append(st, tx);
        b.addEventListener("click", () => { go(i); closeRail(); });
        li.appendChild(b);
        ol.appendChild(li);
      });
      wrap.append(h, ol);
      nav.appendChild(wrap);
    });

    const d = state.done.length;
    el("meter-fill").style.width = (100 * d / TOTAL) + "%";
    el("meter-done").textContent = d + " of " + TOTAL;
    el("meter-pct").textContent = Math.round(100 * d / TOTAL) + "%";
  }

  // ---------------------------------------------------------------- intro
  function renderIntro() {
    const v = el("view");
    v.textContent = "";
    const done = state.done.length;

    const crumb = document.createElement("div");
    crumb.className = "crumb";
    crumb.innerHTML = '<span class="eyebrow">Claude Certified Developer</span>' +
      '<span class="sep">/</span><span class="eyebrow">Foundations first</span>';

    const h = document.createElement("h2");
    h.className = "lesson-t";
    h.textContent = done ? "Welcome back" : "Start here";

    const p = document.createElement("div");
    p.className = "teach";
    p.innerHTML = done
      ? "<p>You have completed <b>" + done + " of " + TOTAL + "</b> lessons. Pick up where you left off, or revisit anything you have already finished from the contents list.</p>"
      : "<p>This is a taught sequence, not a pile of reference material. Each lesson introduces <b>one idea</b>, shows it working, then checks you have it before the next unlocks. It assumes you have never used Claude Code.</p>" +
        "<p>Twenty-four lessons in five modules. Expect roughly ten minutes each. The checks are not decoration &mdash; getting one wrong tells you to reread the section above it, which is the whole point.</p>";

    const map = document.createElement("div");
    map.className = "map";
    COURSE.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "row";
      const n = document.createElement("span"); n.className = "n"; n.textContent = "0" + (i + 1);
      const t = document.createElement("span"); t.className = "t"; t.textContent = m.title;
      const d = document.createElement("span"); d.className = "d"; d.textContent = m.blurb;
      row.append(n, t, d);
      map.appendChild(row);
    });

    const nav = document.createElement("div");
    nav.className = "foot-nav";
    const b = document.createElement("button");
    b.className = "btn";
    b.type = "button";
    const next = unlockedCount();
    b.textContent = done ? "Continue to lesson " + (next + 1) : "Begin lesson 1";
    b.addEventListener("click", () => go(Math.min(next, TOTAL - 1)));
    nav.appendChild(b);

    v.append(crumb, h, p, map, nav);
    el("mob-pos").textContent = done + "/" + TOTAL;
    window.scrollTo(0, 0);
  }

  // --------------------------------------------------------------- lesson
  function renderLesson(i) {
    const L = FLAT[i];
    const v = el("view");
    v.textContent = "";
    answered = {};

    const crumb = document.createElement("div");
    crumb.className = "crumb";
    crumb.innerHTML =
      '<span class="eyebrow">' + esc(L.mod.title) + "</span>" +
      '<span class="sep">/</span>' +
      '<span class="eyebrow">Lesson ' + (i + 1) + " of " + TOTAL + "</span>";

    const h = document.createElement("h2");
    h.className = "lesson-t";
    h.textContent = L.title;

    const obj = document.createElement("div");
    obj.className = "obj";
    obj.innerHTML = '<span class="lbl">You will be able to</span><p>' + esc(L.objective) + "</p>";

    const teach = document.createElement("div");
    teach.className = "teach";
    teach.innerHTML = L.teach;

    v.append(crumb, h, obj, teach);

    if (L.example) {
      const ex = document.createElement("div");
      ex.className = "ex";
      const eh = document.createElement("div");
      eh.className = "ex-h";
      eh.innerHTML = '<span class="eyebrow">' + esc(L.example.label) + "</span>";
      const pre = document.createElement("pre");
      const codeEl = document.createElement("code");
      codeEl.textContent = L.example.code;
      pre.appendChild(codeEl);
      ex.append(eh, pre);
      v.appendChild(ex);
    }

    const take = document.createElement("div");
    take.className = "take";
    take.innerHTML = '<span class="lbl">Remember</span><p>' + esc(L.takeaway) + "</p>";
    v.appendChild(take);

    // ---- checks
    const box = document.createElement("div");
    box.className = "checks";
    const ch = document.createElement("div");
    ch.className = "checks-h";
    ch.innerHTML = "<h3>Check yourself</h3>";
    const sub = document.createElement("p");
    sub.className = "checks-sub";
    sub.textContent = isDone(L.id)
      ? "You have already passed this lesson. Answer again if you want the practice."
      : "Answer " + (L.checks.length === 1 ? "this" : "all " + L.checks.length) +
        " correctly to unlock the next lesson. Wrong answers explain themselves — try again after reading.";
    box.append(ch, sub);

    L.checks.forEach((c, ci) => box.appendChild(buildCheck(L, c, ci)));
    v.appendChild(box);

    // ---- footer nav
    const nav = document.createElement("div");
    nav.className = "foot-nav";
    const prev = document.createElement("button");
    prev.className = "btn ghost";
    prev.type = "button";
    prev.textContent = "Previous";
    prev.disabled = i === 0;
    prev.addEventListener("click", () => go(i - 1));

    const next = document.createElement("button");
    next.className = "btn";
    next.type = "button";
    next.id = "btn-next";
    next.textContent = i === TOTAL - 1 ? "Finish course" : "Next lesson";
    next.disabled = !isDone(L.id);
    next.addEventListener("click", () => {
      if (i === TOTAL - 1) { cursor = null; renderIntro(); renderNav(); }
      else go(i + 1);
    });

    const gate = document.createElement("span");
    gate.className = "gate";
    gate.id = "gate";
    gate.textContent = isDone(L.id) ? "lesson complete" : "complete the check to continue";

    nav.append(prev, next, gate);
    v.appendChild(nav);

    el("mob-pos").textContent = (i + 1) + "/" + TOTAL;
    window.scrollTo(0, 0);
  }

  function buildCheck(L, c, ci) {
    const wrap = document.createElement("div");
    wrap.className = "chk";
    const n = document.createElement("span");
    n.className = "qn";
    n.textContent = "Question " + (ci + 1) + " of " + L.checks.length;
    const q = document.createElement("p");
    q.className = "qt";
    q.textContent = c.q;
    const opts = document.createElement("div");
    opts.className = "opts";
    wrap.append(n, q, opts);

    const multi = c.answer.length > 1;
    let picked = new Set();
    let locked = false;

    const nodes = c.choices.map((choice, oi) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      const mk = document.createElement("span");
      mk.className = "mk";
      mk.textContent = LETTERS[oi] + ")";
      const tx = document.createElement("span");
      tx.textContent = choice;
      b.append(mk, tx);
      b.addEventListener("click", () => {
        if (locked) return;
        if (multi) {
          if (picked.has(oi)) { picked.delete(oi); b.classList.remove("sel"); }
          else { picked.add(oi); b.classList.add("sel"); }
          submit.disabled = picked.size !== c.answer.length;
        } else { picked = new Set([oi]); grade(); }
      });
      opts.appendChild(b);
      return b;
    });

    let multiNote, submit;
    if (multi) {
      multiNote = document.createElement("p");
      multiNote.className = "multi";
      multiNote.textContent = "select " + c.answer.length;
      wrap.appendChild(multiNote);
    }

    const actions = document.createElement("div");
    actions.className = "chk-actions";
    submit = document.createElement("button");
    submit.className = "btn sm";
    submit.type = "button";
    submit.textContent = "Check";
    submit.disabled = true;
    submit.hidden = !multi;
    submit.addEventListener("click", grade);
    const retry = document.createElement("button");
    retry.className = "btn ghost sm";
    retry.type = "button";
    retry.textContent = "Try again";
    retry.hidden = true;
    retry.addEventListener("click", reset);
    actions.append(submit, retry);
    wrap.appendChild(actions);

    const why = document.createElement("div");
    why.className = "why";
    why.hidden = true;
    const vd = document.createElement("div");
    vd.className = "vd";
    const wp = document.createElement("p");
    why.append(vd, wp);
    wrap.appendChild(why);

    function reset() {
      locked = false;
      picked = new Set();
      wrap.className = "chk";
      nodes.forEach((b) => { b.disabled = false; b.className = "opt"; });
      why.hidden = true;
      retry.hidden = true;
      if (multi) { submit.hidden = false; submit.disabled = true; }
    }

    function grade() {
      if (locked) return;
      locked = true;
      const chosen = [...picked].sort((a, b) => a - b);
      const want = [...c.answer].sort((a, b) => a - b);
      const ok = JSON.stringify(chosen) === JSON.stringify(want);

      nodes.forEach((b, oi) => {
        b.disabled = true;
        b.classList.remove("sel");
        if (c.answer.includes(oi)) b.classList.add("right");
        else if (picked.has(oi)) b.classList.add("picked-wrong");
      });
      wrap.classList.add(ok ? "ok" : "no");
      vd.textContent = ok ? "correct" : "not quite";
      vd.className = "vd " + (ok ? "ok" : "no");
      wp.textContent = c.why;
      why.hidden = false;
      submit.hidden = true;
      retry.hidden = ok;

      answered[ci] = ok;
      maybeComplete(L);
    }

    return wrap;
  }

  function maybeComplete(L) {
    const all = L.checks.every((_, ci) => answered[ci] === true);
    if (!all) return;
    if (!isDone(L.id)) {
      state.done.push(L.id);
      save.write(state);
      renderNav();
    }
    const btn = el("btn-next");
    if (btn) btn.disabled = false;
    const g = el("gate");
    if (g) g.textContent = "lesson complete";
  }

  // ----------------------------------------------------------------- misc
  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }
  function go(i) {
    cursor = i;
    state.at = FLAT[i].id;
    save.write(state);
    renderLesson(i);
    renderNav();
  }
  function closeRail() {
    el("rail").classList.remove("open");
    el("scrim").classList.remove("open");
  }

  el("btn-menu").addEventListener("click", () => {
    el("rail").classList.toggle("open");
    el("scrim").classList.toggle("open");
  });
  el("scrim").addEventListener("click", closeRail);
  el("btn-close").addEventListener("click", closeRail);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeRail();
  });
  el("btn-restart").addEventListener("click", () => {
    if (!confirm("Reset all lesson progress?")) return;
    state = { done: [], at: null };
    save.wipe();
    cursor = null;
    renderIntro();
    renderNav();
    closeRail();
  });

  renderNav();
  renderIntro();
})();
</script>
